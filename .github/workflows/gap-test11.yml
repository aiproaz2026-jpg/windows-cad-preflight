name: Fittings library test 11 on installed v6 (headless FreeCAD)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gap:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download private v5 installer and install silently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download standalone-v6 -p DeltaEngineering-Setup-v6.exe -D C:/out
          (Get-FileHash C:/out/DeltaEngineering-Setup-v6.exe -Algorithm SHA256).Hash
          $p = Start-Process C:/out/DeltaEngineering-Setup-v6.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DeltaTest' -Wait -PassThru
          "setup exit $($p.ExitCode)"
      - name: Install new module into installed copy and run headless test
        shell: pwsh
        run: |
          $core = Get-ChildItem C:/DeltaTest -Recurse -Filter core.py | Where-Object { $_.Directory.Name -eq 'DeltaEngineering' } | Select-Object -First 1
          $pkg = $core.Directory.FullName
          $parent = $core.Directory.Parent.FullName
          "package dir: $pkg"
          $fit = @'
          # SPDX-License-Identifier: GPL-3.0-or-later
          """Generic illustrative pump-station fittings with ports, port snapping,
          continuity check and quantity takeoff.

          SCOPE: original generic geometry only. Not a manufacturer catalog, not a flange
          standard, no pressure rating, no hydraulic or pump-selection calculation.
          A matching outer diameter at two ports means geometric size continuity only. It
          does NOT imply pressure, material, standard or gasket compatibility.
          """
          import math
          import FreeCAD as App
          import Part
          from .core import positive

          SCOPE_AR = 'هندسة عامة توضيحية، ليست كتالوج مصنّع ولا معيار شفات. تطابق المقاس لا يعني توافق الضغط أو المعيار.'
          SCOPE_EN = ('Generic illustrative geometry. Not a manufacturer catalog or flange standard. '
                      'Matching port diameter is geometric continuity only, not pressure or standards compatibility.')
          KINDS = {
              'reducer': 'مخفّض متحد المحور',
              'flange': 'شفة عامة',
              'gate_valve': 'محبس بوابة عام',
              'ball_valve': 'محبس كروي عام',
              'check_valve': 'صمام عدم رجوع عام',
              'pump': 'مضخة طرد مركزي عامة (غلاف تقريبي)',
          }
          SNAP_TOL = 0.01  # mm
          DIR_TOL = 1e-6


          def _x():
              return App.Vector(1, 0, 0)


          def _hollow(od, wall, length, start, axis):
              return Part.makeCylinder(od / 2, length, start, axis).cut(
                  Part.makeCylinder(od / 2 - wall, length, start, axis))


          class GenericFitting:
              def __init__(self, obj, kind, od1, wall1, od2=None, wall2=None, length=None):
                  if kind not in KINDS:
                      raise ValueError('Unknown fitting kind')
                  obj.addProperty('App::PropertyString', 'FittingKind', 'Fitting')
                  for key in ('OuterDiameter', 'WallThickness', 'OuterDiameter2', 'WallThickness2', 'Length'):
                      obj.addProperty('App::PropertyLength', key, 'Fitting')
                  obj.addProperty('App::PropertyVectorList', 'PortCenters', 'Connections')
                  obj.addProperty('App::PropertyVectorList', 'PortDirections', 'Connections')
                  obj.addProperty('App::PropertyFloatList', 'PortOuterDiameters', 'Connections')
                  obj.addProperty('App::PropertyString', 'Scope', 'Status')
                  obj.addProperty('App::PropertyString', 'Validation', 'Status')
                  obj.FittingKind = kind
                  obj.OuterDiameter = od1
                  obj.WallThickness = wall1
                  obj.OuterDiameter2 = od2 if od2 else od1
                  obj.WallThickness2 = wall2 if wall2 else wall1
                  obj.Length = length if length else self.default_length(kind, od1)
                  obj.Scope = SCOPE_AR + ' | ' + SCOPE_EN
                  for key in ('PortCenters', 'PortDirections', 'PortOuterDiameters', 'Scope', 'Validation'):
                      obj.setEditorMode(key, 1)
                  obj.Proxy = self
                  if App.GuiUp:
                      obj.ViewObject.Proxy = 0

              @staticmethod
              def default_length(kind, od):
                  return {'reducer': 2.0 * od, 'flange': 0.2 * od, 'gate_valve': 2.5 * od,
                          'ball_valve': 2.2 * od, 'check_valve': 2.5 * od, 'pump': 4.0 * od}[kind]

              def execute(self, obj):
                  try:
                      kind = obj.FittingKind
                      od1 = positive(obj.OuterDiameter.Value, 'Outer diameter')
                      w1 = positive(obj.WallThickness.Value, 'Wall thickness')
                      od2 = positive(obj.OuterDiameter2.Value, 'Second outer diameter')
                      w2 = positive(obj.WallThickness2.Value, 'Second wall thickness')
                      length = positive(obj.Length.Value, 'Length')
                      if w1 >= od1 / 2 or w2 >= od2 / 2:
                          raise ValueError('Wall must be less than radius')
                      x = _x()
                      if kind == 'reducer':
                          if abs(od1 - od2) < 1e-9:
                              raise ValueError('Reducer needs two different diameters')
                          if length < 2 * abs(od1 - od2) / 2 * 2:
                              raise ValueError('Reducer too short for its diameter change')
                          outer = Part.makeCone(od1 / 2, od2 / 2, length, App.Vector(), x)
                          inner = Part.makeCone(od1 / 2 - w1, od2 / 2 - w2, length, App.Vector(), x)
                          shape = outer.cut(inner)
                          centers = [App.Vector(), App.Vector(length, 0, 0)]
                          dirs = [App.Vector(-1, 0, 0), x]
                          ods = [od1, od2]
                      elif kind == 'flange':
                          fod = 1.6 * od1 + 20.0
                          shape = Part.makeCylinder(fod / 2, length, App.Vector(), x).cut(
                              Part.makeCylinder(od1 / 2 - w1, length, App.Vector(), x))
                          centers = [App.Vector(), App.Vector(length, 0, 0)]
                          dirs = [App.Vector(-1, 0, 0), x]
                          ods = [od1, od1]
                      elif kind in ('gate_valve', 'ball_valve', 'check_valve'):
                          if length < 1.5 * od1:
                              raise ValueError('Valve length must be at least 1.5 x outer diameter')
                          r = od1 / 2
                          body = Part.makeCylinder(r, length, App.Vector(), x)
                          mid = App.Vector(length / 2, 0, 0)
                          z = App.Vector(0, 0, 1)
                          if kind == 'gate_valve':
                              body = body.fuse(Part.makeCylinder(0.45 * od1, 0.9 * od1, App.Vector(length / 2, 0, r - w1 / 2), z))
                              body = body.fuse(Part.makeCylinder(0.06 * od1, 1.9 * od1, App.Vector(length / 2, 0, r - w1 / 2), z))
                              body = body.fuse(Part.makeCylinder(0.6 * od1, 0.08 * od1, App.Vector(length / 2, 0, r + 1.8 * od1), z))
                          elif kind == 'ball_valve':
                              body = body.fuse(Part.makeSphere(0.8 * od1, mid))
                              body = body.fuse(Part.makeBox(0.9 * od1, 0.12 * od1, 0.1 * od1,
                                                            App.Vector(length / 2, -0.06 * od1, 0.8 * od1 - 0.02 * od1)))
                          else:
                              body = body.fuse(Part.makeCylinder(0.55 * od1, 0.8 * od1, App.Vector(length / 2, 0, r - w1 / 2), z))
                          shape = body.cut(Part.makeCylinder(r - w1, length + 2, App.Vector(-1, 0, 0), x))
                          centers = [App.Vector(), App.Vector(length, 0, 0)]
                          dirs = [App.Vector(-1, 0, 0), x]
                          ods = [od1, od1]
                      else:  # pump
                          if length < 3 * max(od1, od2):
                              raise ValueError('Pump casing length must be at least 3 x the larger port diameter')
                          rc = 0.75 * max(od1, od2) + 40.0
                          ln = od1
                          xd = ln + length / 2
                          zt = rc + od2
                          solids = [Part.makeCylinder(od1 / 2, ln, App.Vector(), x),
                                    Part.makeCylinder(rc, length, App.Vector(ln, 0, 0), x),
                                    Part.makeCylinder(od2 / 2, zt, App.Vector(xd, 0, 0), App.Vector(0, 0, 1)),
                                    Part.makeCylinder(0.55 * rc, 1.2 * length, App.Vector(ln + length, 0, 0), x)]
                          body = solids[0]
                          for s in solids[1:]:
                              body = body.fuse(s)
                          bore1 = Part.makeCylinder(od1 / 2 - w1, ln + length / 2 + 1, App.Vector(-1, 0, 0), x)
                          bore2 = Part.makeCylinder(od2 / 2 - w2, zt + 2, App.Vector(xd, 0, 0), App.Vector(0, 0, 1))
                          shape = body.cut(bore1).cut(bore2)
                          centers = [App.Vector(), App.Vector(xd, 0, zt)]
                          dirs = [App.Vector(-1, 0, 0), App.Vector(0, 0, 1)]
                          ods = [od1, od2]
                      shape = shape.removeSplitter()
                      if not shape.isValid() or len(shape.Solids) != 1:
                          raise ValueError('Fitting must be one valid solid')
                      obj.Shape = shape
                      obj.PortCenters = centers
                      obj.PortDirections = dirs
                      obj.PortOuterDiameters = ods
                      obj.Validation = 'Valid generic geometry. ' + SCOPE_EN
                  except (ValueError, RuntimeError) as exc:
                      obj.Shape = Part.Shape()
                      obj.PortCenters = []
                      obj.PortDirections = []
                      obj.PortOuterDiameters = []
                      obj.Validation = str(exc)


          # ---------------------------------------------------------------- creation
          def create_fitting(doc, kind, nps1, nps2=None, length=None):
              from .tube_library import PRESETS
              from .documents import add_to
              if nps1 not in PRESETS or (nps2 is not None and nps2 not in PRESETS):
                  raise ValueError('Unknown nominal size')
              p1 = PRESETS[nps1]
              p2 = PRESETS[nps2] if nps2 else p1
              doc.openTransaction('Generic fitting: ' + kind)
              try:
                  obj = doc.addObject('Part::FeaturePython', 'GenericFitting')
                  obj.Label = KINDS[kind] + ' ' + nps1 + ('x' + nps2 if nps2 and nps2 != nps1 else '')
                  GenericFitting(obj, kind, p1['od_mm'], p1['wall_mm'], p2['od_mm'], p2['wall_mm'], length)
                  for key, val in (('SizePort1', 'NPS ' + nps1), ('SizePort2', 'NPS ' + (nps2 or nps1))):
                      obj.addProperty('App::PropertyString', key, 'Dimensional provenance')
                      setattr(obj, key, val)
                      obj.setEditorMode(key, 1)
                  add_to(doc, 'PipingSystem', obj)
                  doc.recompute()
                  if obj.Shape.isNull():
                      raise ValueError(obj.Validation)
                  if App.GuiUp:
                      obj.ViewObject.ShapeColor = (0.25, 0.45, 0.75)
                  doc.commitTransaction()
                  return obj
              except Exception:
                  doc.abortTransaction()
                  doc.recompute()
                  raise


          # ------------------------------------------------------------------- ports
          def ports(obj):
              """Global ports of an object: list of (center, unit direction, outer diameter)."""
              result = []
              if hasattr(obj, 'PortCenters') and hasattr(obj, 'PortDirections') and len(obj.PortCenters):
                  pl = obj.getGlobalPlacement() if hasattr(obj, 'getGlobalPlacement') else obj.Placement
                  ods = list(obj.PortOuterDiameters) if hasattr(obj, 'PortOuterDiameters') and len(obj.PortOuterDiameters) \
                      else [obj.OuterDiameter.Value] * len(obj.PortCenters)
                  for c, d, od in zip(obj.PortCenters, obj.PortDirections, ods):
                      v = pl.Rotation.multVec(d)
                      v.normalize()
                      result.append((pl.multVec(c), v, float(od)))
              elif hasattr(obj, 'PortSource') and hasattr(obj, 'StartPoint') and hasattr(obj, 'EndPoint') and not obj.Shape.isNull():
                  axis = obj.EndPoint - obj.StartPoint
                  if axis.Length > 0:
                      axis.normalize()
                      od = obj.OuterDiameter.Value
                      result.append((obj.StartPoint, App.Vector(-axis.x, -axis.y, -axis.z), od))
                      result.append((obj.EndPoint, axis, od))
              return result


          def port_objects(doc):
              return [o for o in doc.Objects if ports(o)]


          def snap(doc, moving, mport, fixed, fport):
              """Place `moving` so its port mport meets fixed port fport, face to face.
              Refuses a diameter mismatch (geometric continuity only)."""
              if moving.Document != doc or fixed.Document != doc or moving == fixed:
                  raise ValueError('Select two different objects in this document')
              if not isinstance(getattr(moving, 'Proxy', None), GenericFitting):
                  raise ValueError('Only a generic fitting can be moved by snapping')
              if any(p.isDerivedFrom('App::Part') for p in moving.InListRecursive):
                  raise ValueError('Fitting must stay at document root, outside Part containers')
              mp, fp = ports(moving), ports(fixed)
              if not (0 <= mport < len(mp)) or not (0 <= fport < len(fp)):
                  raise ValueError('Invalid port index')
              mc, md, mod = mp[mport]
              fc, fd, fod = fp[fport]
              if abs(mod - fod) > 1e-6:
                  raise ValueError('Port diameter mismatch: %.3f mm vs %.3f mm. Geometric continuity only, no compatibility implied.' % (mod, fod))
              target = App.Vector(-fd.x, -fd.y, -fd.z)
              rot = App.Rotation(md, target)
              old = moving.Placement
              new_rot = rot.multiply(old.Rotation)
              local_center = moving.PortCenters[mport]
              new_pos = fc - new_rot.multVec(local_center)
              doc.openTransaction('Snap fitting port to port')
              try:
                  moving.Placement = App.Placement(new_pos, new_rot)
                  doc.recompute()
                  c2, d2, _ = ports(moving)[mport]
                  if (c2 - fc).Length > SNAP_TOL or d2.dot(fd) > -1 + 1e-6:
                      raise ValueError('Snap verification failed')
                  doc.commitTransaction()
                  return moving
              except Exception:
                  doc.abortTransaction()
                  doc.recompute()
                  raise


          # ------------------------------------------------------------- continuity
          def check_continuity(doc, overlap_tol_mm3=1.0):
              """Pairs of ports within SNAP_TOL are connections; they must face each other
              and have equal diameter. Remaining ports are reported as open. Solids of
              objects that are not directly connected must not overlap."""
              items = []
              for o in port_objects(doc):
                  for i, (c, d, od) in enumerate(ports(o)):
                      items.append((o, i, c, d, od))
              connected, errors, used = [], [], set()
              for a in range(len(items)):
                  for b in range(a + 1, len(items)):
                      oa, ia, ca, da, oda = items[a]
                      ob, ib, cb, db, odb = items[b]
                      if oa == ob or (ca - cb).Length > SNAP_TOL:
                          continue
                      used.add(a)
                      used.add(b)
                      name = '%s.%d <-> %s.%d' % (oa.Name, ia, ob.Name, ib)
                      if da.dot(db) > -1 + 1e-6:
                          errors.append(name + ': ports do not face each other')
                      elif abs(oda - odb) > 1e-6:
                          errors.append(name + ': diameter mismatch %.3f vs %.3f mm' % (oda, odb))
                      else:
                          connected.append(name)
              open_ports = ['%s.%d' % (items[k][0].Name, items[k][1]) for k in range(len(items)) if k not in used]
              linked = {frozenset((x.split(' <-> ')[0].split('.')[0], x.split(' <-> ')[1].split('.')[0])) for x in connected}
              objs = port_objects(doc)
              for a in range(len(objs)):
                  for b in range(a + 1, len(objs)):
                      if frozenset((objs[a].Name, objs[b].Name)) in linked:
                          continue
                      if not objs[a].Shape.BoundBox.intersect(objs[b].Shape.BoundBox):
                          continue
                      vol = objs[a].Shape.common(objs[b].Shape).Volume
                      if vol > overlap_tol_mm3:
                          errors.append('Overlap %s / %s: %.1f mm3' % (objs[a].Name, objs[b].Name, vol))
              return {'connected': connected, 'open_ports': open_ports, 'errors': errors,
                      'ok': not errors, 'scope': SCOPE_EN}


          # ---------------------------------------------------------------- takeoff
          def takeoff(doc):
              """Count fittings by kind and size; sum straight tube length by diameter."""
              rows = {}
              for o in doc.Objects:
                  if isinstance(getattr(o, 'Proxy', None), GenericFitting) and not o.Shape.isNull():
                      size = o.SizePort1 if o.SizePort1 == o.SizePort2 else o.SizePort1 + ' x ' + o.SizePort2
                      key = ('fitting', o.FittingKind, size)
                      rows[key] = rows.get(key, 0) + 1
                  elif hasattr(o, 'PortSource') and not o.Shape.isNull():
                      key = ('tube', 'OD %.1f x %.2f mm' % (o.OuterDiameter.Value, o.WallThickness.Value), 'm')
                      rows[key] = rows.get(key, 0.0) + o.CenterlineLength.Value / 1000.0
                  elif o.TypeId == 'PartDesign::FeaturePython' and hasattr(o, 'SourcePath') and not o.Shape.isNull() \
                          and hasattr(o, 'CenterlineLength'):
                      key = ('tube', 'OD %.1f x %.2f mm' % (o.OuterDiameter.Value, o.WallThickness.Value), 'm')
                      rows[key] = rows.get(key, 0.0) + o.CenterlineLength.Value / 1000.0
              out = []
              for (cls, a, b), n in sorted(rows.items()):
                  if cls == 'fitting':
                      out.append({'item': KINDS[a], 'kind': a, 'size': b, 'qty': n, 'unit': 'pcs'})
                  else:
                      out.append({'item': 'ماسورة مستقيمة', 'kind': 'tube', 'size': a, 'qty': round(n, 4), 'unit': b})
              return out


          def takeoff_csv(doc, path):
              import csv
              rows = takeoff(doc)
              with open(path, 'w', encoding='utf-8-sig', newline='') as fh:
                  w = csv.writer(fh)
                  w.writerow(['# ' + SCOPE_AR])
                  w.writerow(['# ' + SCOPE_EN])
                  w.writerow(['item', 'kind', 'size', 'qty', 'unit'])
                  for r in rows:
                      w.writerow([r['item'], r['kind'], r['size'], r['qty'], r['unit']])
              return rows
          '@
          Set-Content "$pkg\fittings.py" $fit -Encoding utf8
          $test = @'
          import os, sys, json, math, time, traceback
          OUT = os.environ.get('DELTA_OUT', 'C:/fit11')
          PKG = os.environ.get('DELTA_PKG_PARENT')
          if PKG and PKG not in sys.path:
              sys.path.insert(0, PKG)
          os.makedirs(OUT, exist_ok=True)
          res = {'steps': {}, 'done': False}


          def save():
              open(OUT + '/fittings-result.json', 'w', encoding='utf-8').write(json.dumps(res, ensure_ascii=False, indent=1, default=str))


          def run(name, fn):
              t = time.time()
              try:
                  d = fn()
                  res['steps'][name] = {'ok': True, 'secs': round(time.time() - t, 2), 'detail': d}
              except Exception:
                  res['steps'][name] = {'ok': False, 'secs': round(time.time() - t, 2), 'error': traceback.format_exc()}
              save()


          def rel(a, b):
              return abs(a - b) / max(abs(b), 1e-12)


          try:
              import FreeCAD as App, Part
              from DeltaEngineering import fittings as F
              from DeltaEngineering.tube_library import PRESETS
              doc = App.newDocument('Station')
              doc.UndoMode = 1
              P = PRESETS

              def r_of(nps):
                  return P[nps]['od_mm'] / 2, P[nps]['od_mm'] / 2 - P[nps]['wall_mm']

              def s_formula():
                  out = {}
                  # reducer NPS 4 -> 2, independent frustum formula
                  red = F.create_fitting(doc, 'reducer', '4', '2')
                  R1, r1 = r_of('4'); R2, r2 = r_of('2'); h = red.Length.Value
                  exp = math.pi * h / 3 * ((R1 * R1 + R1 * R2 + R2 * R2) - (r1 * r1 + r1 * r2 + r2 * r2))
                  out['reducer_volume'] = red.Shape.Volume; out['reducer_expected'] = exp
                  assert rel(red.Shape.Volume, exp) < 1e-6, 'reducer volume vs formula'
                  # flange, independent annulus formula
                  fl = F.create_fitting(doc, 'flange', '3')
                  R, r = r_of('3'); fod = 1.6 * P['3']['od_mm'] + 20.0; t = fl.Length.Value
                  exp2 = math.pi * t * ((fod / 2) ** 2 - r * r)
                  out['flange_volume'] = fl.Shape.Volume; out['flange_expected'] = exp2
                  assert rel(fl.Shape.Volume, exp2) < 1e-6, 'flange volume vs formula'
                  for k in ('gate_valve', 'ball_valve', 'check_valve'):
                      v = F.create_fitting(doc, k, '2')
                      assert v.Shape.isValid() and len(v.Shape.Solids) == 1, k
                      bb = v.Shape.BoundBox
                      c0, c1 = v.PortCenters
                      assert bb.XMin <= c0.x + 1e-6 and bb.XMax >= c1.x - 1e-6, k + ' ports inside bbox'
                      out[k + '_volume'] = round(v.Shape.Volume, 1)
                  pump = F.create_fitting(doc, 'pump', '3', '2')
                  assert pump.Shape.isValid() and len(pump.Shape.Solids) == 1
                  out['pump_ports'] = [[round(c.x, 2), round(c.y, 2), round(c.z, 2)] for c in pump.PortCenters]
                  for o in list(doc.Objects):
                      if hasattr(o, 'FittingKind'):
                          doc.removeObject(o.Name)
                  doc.recompute()
                  return out
              run('formula_volumes_and_validity', s_formula)

              chain = {}

              def s_station():
                  pump = F.create_fitting(doc, 'pump', '3', '2')
                  pump.Placement = App.Placement(App.Vector(1000, -400, 250), App.Rotation(App.Vector(1, 2, 3), 37))
                  doc.recompute()
                  chain['pump'] = pump
                  joints = []

                  f1 = F.create_fitting(doc, 'flange', '2'); F.snap(doc, f1, 0, pump, 1); joints.append((f1, pump))
                  v1 = F.create_fitting(doc, 'gate_valve', '2'); F.snap(doc, v1, 0, f1, 1); joints.append((v1, f1))
                  f2 = F.create_fitting(doc, 'flange', '2'); F.snap(doc, f2, 0, v1, 1); joints.append((f2, v1))
                  rd = F.create_fitting(doc, 'reducer', '2', '4'); F.snap(doc, rd, 0, f2, 1); joints.append((rd, f2))
                  bv = F.create_fitting(doc, 'ball_valve', '4'); F.snap(doc, bv, 0, rd, 1); joints.append((bv, rd))
                  # suction side: pump.0 (NPS 3)
                  s1 = F.create_fitting(doc, 'flange', '3'); F.snap(doc, s1, 0, pump, 0); joints.append((s1, pump))
                  cv = F.create_fitting(doc, 'check_valve', '3'); F.snap(doc, cv, 0, s1, 1); joints.append((cv, s1))
                  chain.update(dict(f1=f1, v1=v1, f2=f2, rd=rd, bv=bv, s1=s1, cv=cv, joints=joints))
                  # independent geometric verification of every joint using Placement math only
                  worst_d = 0.0; worst_a = 0.0
                  for a, b in joints:
                      pa = F.ports(a); pb = F.ports(b)
                      best = None
                      for ca, da, oa in pa:
                          for cb, db, ob in pb:
                              d = (ca - cb).Length
                              if best is None or d < best[0]:
                                  best = (d, da.dot(db), abs(oa - ob))
                      worst_d = max(worst_d, best[0]); worst_a = max(worst_a, abs(best[1] + 1))
                      assert best[2] < 1e-6
                  assert worst_d < 0.01 and worst_a < 1e-6, (worst_d, worst_a)
                  rep = F.check_continuity(doc)
                  assert rep['ok'], rep
                  assert len(rep['connected']) == 7, rep
                  assert len(rep['open_ports']) == 2, rep['open_ports']
                  return {'joints': len(rep['connected']), 'open_ports': rep['open_ports'], 'worst_center_gap_mm': worst_d,
                          'worst_direction_error': worst_a, 'errors': rep['errors']}
              run('station_snap_rotated_continuity', s_station)

              def s_mismatch():
                  rd = chain['rd']
                  before = App.Placement(chain['bv'].Placement)
                  fl4 = F.create_fitting(doc, 'flange', '4')
                  place_before = App.Placement(fl4.Placement)
                  refused = ''
                  try:
                      F.snap(doc, fl4, 0, chain['f1'], 1)  # NPS4 flange against NPS2 flange port
                  except ValueError as e:
                      refused = str(e)
                  assert 'mismatch' in refused, refused
                  assert fl4.Placement.isSame(place_before, 1e-9)
                  doc.removeObject(fl4.Name); doc.recompute()
                  # deliberately broken chain: move a flange by 5 mm along its axis -> open ports and no silent pass
                  v = chain['v1']; old = App.Placement(v.Placement)
                  v.Placement = App.Placement(old.Base + App.Vector(5, 0, 0), old.Rotation); doc.recompute()
                  rep = F.check_continuity(doc)
                  broken_open = len(rep['open_ports'])
                  v.Placement = old; doc.recompute()
                  rep2 = F.check_continuity(doc)
                  assert broken_open > 2 and rep2['ok'] and len(rep2['open_ports']) == 2, (broken_open, rep2)
                  return {'mismatch_message': refused, 'placement_unchanged': True, 'open_ports_when_displaced_5mm': broken_open}
              run('mismatch_refused_and_displacement_detected', s_mismatch)

              def s_overlap():
                  ov = F.create_fitting(doc, 'gate_valve', '2')
                  ov.Placement = App.Placement(chain['pump'].Placement.Base, chain['pump'].Placement.Rotation); doc.recompute()
                  rep = F.check_continuity(doc)
                  found = [e for e in rep['errors'] if e.startswith('Overlap')]
                  doc.removeObject(ov.Name); doc.recompute()
                  rep2 = F.check_continuity(doc)
                  assert found and rep2['ok'], (found, rep2)
                  return {'overlap_reports': len(found)}
              run('overlap_detected_then_cleared', s_overlap)

              def s_undo():
                  nf = F.create_fitting(doc, 'flange', '2')
                  p0 = App.Placement(nf.Placement)
                  # snap to the free end of pump suction check valve (NPS3) would mismatch; use free end of ball valve (NPS4)
                  nf4 = F.create_fitting(doc, 'flange', '4'); q0 = App.Placement(nf4.Placement)
                  F.snap(doc, nf4, 0, chain['bv'], 1)
                  moved = not nf4.Placement.isSame(q0, 1e-6)
                  doc.undo(); doc.recompute()
                  restored = nf4.Placement.isSame(q0, 1e-9)
                  doc.redo(); doc.recompute()
                  redone = not nf4.Placement.isSame(q0, 1e-6)
                  assert moved and restored and redone, (moved, restored, redone)
                  chain['end_flange'] = nf4
                  doc.removeObject(nf.Name); doc.recompute()
                  return {'moved': moved, 'undo_restored': restored, 'redo_reapplied': redone}
              run('snap_undo_redo', s_undo)

              expected_bom = {}

              def s_bom():
                  rows = F.takeoff(doc)
                  got = {(r['kind'], r['size']): r['qty'] for r in rows}
                  exp = {('pump', 'NPS 3 x NPS 2'): 1, ('flange', 'NPS 2'): 2, ('gate_valve', 'NPS 2'): 1, ('reducer', 'NPS 2 x NPS 4'): 1,
                         ('ball_valve', 'NPS 4'): 1, ('flange', 'NPS 3'): 1, ('check_valve', 'NPS 3'): 1, ('flange', 'NPS 4'): 1}
                  assert got == exp, (got, exp)
                  path = OUT + '/takeoff.csv'
                  F.takeoff_csv(doc, path)
                  text = open(path, encoding='utf-8-sig').read()
                  assert 'Matching port diameter is geometric continuity only' in text and 'item,kind,size,qty,unit' in text
                  return {'rows': rows, 'csv_has_scope_notice': True}
              run('quantity_takeoff_matches_independent_list', s_bom)

              def s_reopen_step():
                  folder = OUT + '/مشروع محطة'
                  os.makedirs(folder, exist_ok=True)
                  path = folder + '/محطة.FCStd'
                  names = [o.Name for o in doc.Objects if hasattr(o, 'FittingKind')]
                  vols = {n: doc.getObject(n).Shape.Volume for n in names}
                  doc.saveAs(path)
                  App.closeDocument(doc.Name)
                  d2 = App.openDocument(path)
                  d2.recompute()
                  diffs = max(abs(d2.getObject(n).Shape.Volume - v) for n, v in vols.items())
                  rep = F.check_continuity(d2)
                  assert diffs < 1e-6 and rep['ok'] and len(rep['connected']) == 8, (diffs, rep)
                  step = OUT + '/station.step'
                  objs = [d2.getObject(n) for n in names]
                  Part.export(objs, step)
                  imp = Part.read(step)
                  total = sum(vols.values())
                  assert rel(imp.Volume, total) < 1e-5, (imp.Volume, total)
                  res['_doc2'] = d2.Name
                  return {'objects': len(names), 'max_volume_diff_after_reopen': diffs, 'connections_after_reopen': len(rep['connected']),
                          'ok_after_reopen': rep['ok'], 'step_volume': imp.Volume, 'sum_volume': total, 'step_bytes': os.path.getsize(step)}
              run('arabic_path_save_reopen_and_step', s_reopen_step)

              def s_scale():
                  d3 = App.newDocument('Scale')
                  t0 = time.time()
                  first = F.create_fitting(d3, 'flange', '2')
                  prev = first; n = 1
                  kinds = ['gate_valve', 'flange', 'check_valve', 'flange']
                  while n < 60:
                      o = F.create_fitting(d3, kinds[n % 4], '2'); F.snap(d3, o, 0, prev, 1); prev = o; n += 1
                  t1 = time.time()
                  rep = F.check_continuity(d3)
                  t2 = time.time()
                  assert rep['ok'] and len(rep['connected']) == 59 and len(rep['open_ports']) == 2, rep
                  return {'fittings': n, 'build_snap_secs': round(t1 - t0, 2), 'continuity_secs': round(t2 - t1, 2), 'scope': 'one CI run, 60 generic fittings in a chain, not a requirement or memory claim'}
              run('chain_of_60_fittings', s_scale)
          except Exception:
              res['error'] = traceback.format_exc()
          res['done'] = True
          save()
          '@
          Set-Content C:/test_fittings.py $test -Encoding utf8
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          "cmd: $($cmd.FullName)"
          New-Item -ItemType Directory -Force C:/fit11 | Out-Null
          $env:DELTA_OUT = 'C:/fit11'; $env:DELTA_PKG_PARENT = $parent
          $p = Start-Process $cmd.FullName -ArgumentList 'C:/test_fittings.py' -RedirectStandardOutput C:/fit11/stdout.txt -RedirectStandardError C:/fit11/stderr.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(600000)) { $p.Kill(); "TIMEOUT" }
          "exit: $($p.ExitCode)"
          Get-Content C:/fit11/stdout.txt -Tail 20
          Get-Content C:/fit11/stderr.txt -Tail 20
          if (Test-Path C:/fit11/fittings-result.json) { Get-Content C:/fit11/fittings-result.json -Raw | Select-String -Pattern '"ok"' -AllMatches | ForEach-Object { $_.Matches.Count } }
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git pull --rebase || true
          mkdir -p dist/v11fit; cp /c/fit11/fittings-result.json /c/fit11/takeoff.csv /c/fit11/stdout.txt /c/fit11/stderr.txt dist/v11fit/ || true
          git add dist
          git commit -m "Add fittings library test evidence" || true
          git push
