                  rep = F.check_continuity(self.panel.doc())
                  lines = ['وصلات متطابقة: %d' % len(rep['connected']), 'منافذ مفتوحة: %d' % len(rep['open_ports'])]
                  lines += ['  ' + p for p in rep['open_ports']]
                  if rep['errors']:
