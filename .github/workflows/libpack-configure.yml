name: Windows LibPack configure probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Fetch pinned upstream LibPack 3.1.1.3 (no cache)
        shell: bash
        run: |
          set -x
          mkdir -p /c/FC/libpack
          curl -fL --retry 3 -o libpack.7z https://github.com/FreeCAD/FreeCAD-LibPack/releases/download/3.1.1.3/LibPack-1.1.0-v3.1.1.3-Release.7z
          ls -l libpack.7z
          7z x libpack.7z -o"libpacktemp" -r -y > /dev/null
          mv libpacktemp/LibPack-1.1.0-v3.1.1.3-Release/* /c/FC/libpack/
          rm -rf libpacktemp libpack.7z
          ls /c/FC/libpack | head -30
      - name: Clone public FreeCAD 1.1.4
        shell: pwsh
        run: |
          git clone --depth 1 --branch 1.1.4 --single-branch --recurse-submodules --shallow-submodules https://github.com/FreeCAD/FreeCAD.git C:/FC/src
          git -C C:/FC/src rev-parse HEAD
      - name: Configure with upstream release preset
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Free
          cmake -B C:/FC/build C:/FC/src --preset release -DCMAKE_VS_NO_COMPILE_BATCHING=ON -DCMAKE_BUILD_TYPE=Release -DFREECAD_USE_PCH=OFF -DFREECAD_RELEASE_PDB=OFF -DFREECAD_LIBPACK_DIR="C:/FC/libpack/" -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON
          $r = $LASTEXITCODE
          "Configure exit code: $r" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Free
          if ($r) { exit $r }
      - name: Time one small target (Base) to estimate full build
        shell: pwsh
        run: |
          $t = Get-Date
          cmake --build C:/FC/build --config Release --target FreeCADBase --parallel 2
          $r = $LASTEXITCODE
          "FreeCADBase build exit $r in $([int]((Get-Date)-$t).TotalSeconds)s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          exit $r
