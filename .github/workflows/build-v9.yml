name: Build v9 standalone offline installer and verify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v9:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v58 source and apply patches/v9 chain (v3 to v9)
        shell: bash
        run: |
          mkdir -p /c/delta /c/out
          unzip -q src/*DeltaEngineering-development-source-v58-10539385.zip -d /c/delta
          python patches/v7/apply_v7.py C:/delta/DeltaEngineering
          git rev-parse HEAD | tee /c/out/source-revision.txt
          sha256sum src/*DeltaEngineering-development-source-v58-10539385.zip patches/v7/*.py patches/v6/*.py patches/v4/*.py patches/v3/*.py | tee -a /c/out/source-revision.txt
      - name: Import check of patched package with plain python syntax compile
        shell: bash
        run: |
          python -m compileall -q C:/delta/DeltaEngineering/package/Mod/DeltaEngineering && echo "compile ok"
          ls C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/DeltaEngineering/*.py | wc -l
      - name: Stage official FreeCAD 1.1.4 plus Delta addon (offline bundle)
        shell: pwsh
        run: |
          $base = 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4'
          $name = 'FreeCAD_1.1.4-Windows-x86_64-py311-installer.exe'
          Invoke-WebRequest "$base/$name" -OutFile C:/fc.exe -UseBasicParsing
          $want = (([string](Invoke-RestMethod "$base/$name-SHA256.txt")) -split '\s+')[0]
          $got = (Get-FileHash C:/fc.exe -Algorithm SHA256).Hash
          if ($got -ine $want) { throw "SHA256 mismatch" }
          "FreeCAD installer SHA256 verified: $got"
          $p = Start-Process C:/fc.exe -ArgumentList '/S','/D=C:\stagebase' -Wait -PassThru
          "official installer exit $($p.ExitCode)"
          $exe = Get-ChildItem C:/stagebase -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory C:/stage -Force | Out-Null
          Copy-Item "$root/*" C:/stage -Recurse -Force
          Get-ChildItem C:/stage -Filter 'Uninstall*' -ErrorAction SilentlyContinue | Remove-Item -Force
          New-Item -ItemType Directory C:/stage/Mod -Force | Out-Null
          Copy-Item C:/delta/DeltaEngineering/package/Mod/DeltaEngineering C:/stage/Mod/DeltaEngineering -Recurse -Force
          Copy-Item C:/delta/DeltaEngineering/LaunchDelta.FCMacro C:/stage/LaunchDelta.FCMacro -Force
          Copy-Item C:/out/source-revision.txt C:/stage/DELTA-SOURCE-REVISION.txt -Force
          @'
          Delta Engineering v9 offline installer (unsigned, experimental, NOT certified for engineering use).
          Contains: FreeCAD 1.1.4 (LGPL-2.1-or-later, https://github.com/FreeCAD/FreeCAD/releases/tag/1.1.4 , source at the same tag),
          and the Delta Engineering Python addon (GPL-3.0-or-later).
          Generic fittings and electrical symbols are illustrative geometry. Drawings are geometric drafts.
          Full license inventory is NOT complete yet.

          '@ | Set-Content C:/stage/DELTA-NOTICE.txt -Encoding utf8
          @'
          # Delta Engineering launcher: activates the Delta workbench and closes FreeCAD's stock Start tab.
          import FreeCAD as App
          import FreeCADGui as Gui
          import DeltaEngineering.core
          import DeltaEngineering.domain
          from DeltaEngineering.gui import register
          if 'DeltaWorkbench' not in Gui.listWorkbenches(): register()
          Gui.activateWorkbench('DeltaWorkbench')
          try:
              try:
                  from PySide6 import QtWidgets, QtCore
              except Exception:
                  from PySide import QtWidgets, QtCore
              def _close_start():
                  for sw in Gui.getMainWindow().findChildren(QtWidgets.QMdiSubWindow):
                      w = sw.widget()
                      cn = w.metaObject().className() if w is not None else ''
                      if 'StartView' in cn or (sw.windowTitle().strip() == 'Start' and not App.listDocuments()):
                          sw.close()
              def _tidy(fit):
                  try:
                      if not Gui.Control.activeDialog():
                          for dk in Gui.getMainWindow().findChildren(QtWidgets.QDockWidget):
                              if dk.objectName() == 'Tasks' and not dk.isFloating():
                                  dk.hide()
                  except Exception as e2:
                      App.Console.PrintWarning('Delta layout: ' + str(e2) + '\n')
              for ms in (1500, 4000, 8000):
                  QtCore.QTimer.singleShot(ms, _close_start)
                  QtCore.QTimer.singleShot(ms + 300, lambda: _tidy(False))
          except Exception as e:
              App.Console.PrintWarning('Delta launcher: ' + str(e) + '\n')
          '@ | Set-Content C:/stage/LaunchDelta.FCMacro -Encoding utf8
          New-Item -ItemType Directory C:/stage/DeltaDefaults -Force | Out-Null
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="no" ?>
          <FCParameters>
            <FCParamGroup Name="Root">
              <FCParamGroup Name="BaseApp">
                <FCParamGroup Name="Preferences">
                  <FCParamGroup Name="General">
                    <FCText Name="Language">Arabic</FCText>
                  </FCParamGroup>
                </FCParamGroup>
              </FCParamGroup>
            </FCParamGroup>
          </FCParameters>
          '@ | Set-Content C:/stage/DeltaDefaults/user.cfg -Encoding utf8
          $sz = (Get-ChildItem C:/stage -Recurse -File | Measure-Object Length -Sum).Sum
          "staged size MB $([math]::Round($sz/1MB))"
      - name: Build offline installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'ISCC not found' }
          @'
          [Setup]
          AppName=Delta Engineering
          AppVersion=8
          AppPublisher=Delta Engineering (unsigned build)
          DefaultDirName={localappdata}\Programs\DeltaEngineering
          DefaultGroupName=Delta Engineering
          PrivilegesRequired=lowest
          Compression=lzma2/fast
          SolidCompression=yes
          OutputDir=C:\out
          OutputBaseFilename=DeltaEngineering-Setup-v9
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          UninstallDisplayName=Delta Engineering
          [Files]
          Source: "C:\stage\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          Source: "C:\stage\DeltaDefaults\user.cfg"; DestDir: "{userappdata}\FreeCAD\v1-1"; Flags: onlyifdoesntexist uninsneveruninstall
          [Icons]
          Name: "{autoprograms}\Delta Engineering"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          Name: "{autodesktop}\Delta Engineering"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; Description: "Start Delta Engineering"; Flags: postinstall nowait skipifsilent unchecked

          '@ | Set-Content C:/delta.iss -Encoding ascii
          & $iscc C:/delta.iss 2>&1 | Select-Object -Last 15
          Get-Item C:/out/DeltaEngineering-Setup-v9.exe | Select-Object Name,Length
          (Get-FileHash C:/out/DeltaEngineering-Setup-v9.exe -Algorithm SHA256).Hash
      - name: Add Mesa llvmpipe software OpenGL (CI only)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
      - name: Install silently as the setup exe (per-user, no admin) and check files
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process C:/out/DeltaEngineering-Setup-v9.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DeltaTest' -Wait -PassThru
          "setup exit $($p.ExitCode) seconds $($sw.Elapsed.TotalSeconds)"
          if ($p.ExitCode -ne 0) { throw 'setup failed' }
          $sz = (Get-ChildItem C:/DeltaTest -Recurse -File | Measure-Object Length -Sum).Sum
          "installed size MB $([math]::Round($sz/1MB))"
          "addon present: $(Test-Path C:/DeltaTest/Mod/DeltaEngineering/InitGui.py)"
          "fittings module present: $(Test-Path C:/DeltaTest/Mod/DeltaEngineering/DeltaEngineering/fittings.py)"
          "shortcut: $(Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Delta Engineering.lnk")"
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'
          $mods = 'core','domain','symbols','export','fittings','documents','scaled_output','tube_library','drafting','electrical','connectivity'
          $lines = @('import sys, FreeCAD, importlib','sys.path.insert(0, ''C:/DeltaTest/Mod'')','sys.path.insert(0, ''C:/DeltaTest/Mod/DeltaEngineering'')'); foreach ($m in $mods) { $lines += "try:`n    importlib.import_module('DeltaEngineering.$m'); print('OK $m')`nexcept Exception as e:`n    print('FAIL $m', repr(e))" }
          $lines | Set-Content C:/imp.py -Encoding utf8
          $o = & $cmd.FullName -c "exec(open('C:/imp.py',encoding='utf-8').read())" 2>&1 | Out-String; $o
          $okc = @([regex]::Matches($o, '(?m)^OK (\w+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique).Count
          "distinct OK imports: $okc"
          if ($okc -ne 11) { throw "import check: expected 11 OK, got $okc" }
          if ($o -match 'FAIL ') { throw 'import check failed' }
      - name: Copy Mesa into installed app (CI only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $bin = $exe.Directory.FullName
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
      - name: Run GUI macro (patches/v7/macro_gui_test.py) on the installed v9 at 1366x768
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/fit12 | Out-Null
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          Copy-Item "$env:GITHUB_WORKSPACE/patches/v7/macro_gui_test.py" "$root\DeltaGuiTest12.FCMacro" -Force
          $env:DELTA_OUT = 'C:/fit12'; $env:GALLIUM_DRIVER = 'llvmpipe'; $env:MESA_GL_VERSION_OVERRIDE = '4.5'
          Start-Process $exe.FullName -ArgumentList "`"$root\DeltaGuiTest12.FCMacro`"" -RedirectStandardOutput C:/fit12/fc-out.txt -RedirectStandardError C:/fit12/fc-err.txt
          $t = 0
          while ($t -lt 420) { Start-Sleep 5; $t += 5; if ((Test-Path C:/fit12/gui-result12.json) -and (Select-String -Path C:/fit12/gui-result12.json -Pattern '"done": true' -Quiet)) { break } }
          if (-not (Test-Path C:/fit12/gui-result12.json) -or -not (Select-String -Path C:/fit12/gui-result12.json -Pattern '"done": true' -Quiet)) {
            try { Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size); $bmp.Save('C:/fit12/fit12-hang.png') } catch { "screenshot failed: $_" | Out-File C:/fit12/diag.txt -Append }
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName) | $($_.MainWindowTitle)" } | Out-File C:/fit12/diag.txt -Append
          }
          Start-Sleep 4; Get-Process FreeCAD -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - name: Publish installer as private release asset and commit evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git pull --rebase || true
          mkdir -p dist/v9
          sha256sum /c/out/DeltaEngineering-Setup-v9.exe | tee dist/v9/DeltaEngineering-Setup-v9.exe.sha256 || true
          cp /c/out/source-revision.txt dist/v9/ || true
          cp /c/fit12/*.png /c/fit12/*.pdf /c/fit12/gui-result12.json /c/fit12/fc-err.txt /c/fit12/diag.txt dist/v9/ || true
          for f in dist/v9/*.png dist/v9/station-*.pdf; do [ -f "$f" ] && base64 -w0 "$f" > "$f.b64"; done
          git add dist
          git commit -m "Add v9 installer build evidence" || true
          git push
          [ -f /c/out/DeltaEngineering-Setup-v9.exe ] && gh release create standalone-v9 /c/out/DeltaEngineering-Setup-v9.exe --title "Delta Engineering v9 offline installer (unsigned, experimental, unverified)" --notes "Private. Built from the repo revision in dist/v9/source-revision.txt. Not certified; item acceptance still open." || echo "release failed"
      - name: Gate verdict (fails on timeout, absent result, error or failed step)
        if: always()
        shell: pwsh
        run: |
          $f = 'C:/fit12/gui-result12.json'
          if (-not (Test-Path $f)) { throw 'GATE FAIL: no result file written' }
          $r = Get-Content $f -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $r.done) { throw 'GATE FAIL: macro did not finish' }
          if ($r.error) { throw 'GATE FAIL: macro error recorded' }
          $bad = @($r.steps.PSObject.Properties | Where-Object { $_.Value.PSObject.Properties.Name -contains 'ok' -and -not $_.Value.ok } | ForEach-Object { $_.Name })
          if ($bad.Count -gt 0) { throw ('GATE FAIL: failed steps: ' + ($bad -join ', ')) }
          $t = $r.steps.tasks_dock_hidden_again_after_task_closes.detail
          if (-not ($t.dialog_active_when_open -eq $true -and $t.dialog_active_after_close -eq $false)) { throw 'GATE FAIL: fake task dialog did not open and close' }
          "GATE PASS"

