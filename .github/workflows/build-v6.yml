name: Build v6 standalone offline installer and verify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v6:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source and apply patches (v2 gui, v3 and v4 drafting/export)
        shell: bash
        run: |
          mkdir -p /c/delta patches/v4
          unzip -q src/*DeltaEngineering-development-source-v58-10539385.zip -d /c/delta
          cp -r /c/delta/DeltaEngineering /c/delta_orig
          cat > patches/v4/apply_v4.py <<'PY'
          """Delta Engineering v4 patches: applies v3 (apply_v3.py) first, then diagonal dimension label placement."""
          import sys,os,subprocess
          root=sys.argv[1]
          here=os.path.dirname(os.path.abspath(__file__))
          subprocess.check_call([sys.executable,os.path.join(here,'..','v3','apply_v3.py'),root])
          DR_OLD=("        else:\n"
          "            labels.append((str(round(dim.Distance.Value,3))+' mm',middle.x-20,middle.y+15,'right'))")
          DR_NEW=("        elif abs(vector.y)<0.05:\n"
          "            labels.append((str(round(dim.Distance.Value,3))+' mm',middle.x-20,middle.y+15,'right'))\n"
          "        else:\n"
          "            normal=side if offset>=0 else side*-1\n"
          "            labels.append((str(round(dim.Distance.Value,3))+' mm',middle.x,middle.y,'normal',(normal.x,normal.y)))")
          EX_OLD=("                for text,x,y,side in annotations:\n"
          "                    px=target.x()+(x-box.x())*ratio\n"
          "                    py=target.y()+(-y-box.y())*ratio\n"
          "                    labelrect=QtCore.QRectF(px-125 if side=='left' else px+8,py-12,117,24)\n"
          "                    painter.drawText(labelrect,int(QtCore.Qt.AlignRight if side=='left' else QtCore.Qt.AlignLeft),text)")
          EX_NEW=("                for ann in annotations:\n"
          "                    text,x,y,side=ann[:4]\n"
          "                    px=target.x()+(x-box.x())*ratio\n"
          "                    py=target.y()+(-y-box.y())*ratio\n"
          "                    if side=='normal':\n"
          "                        nx,ny=ann[4]\n"
          "                        ax=px+nx*10;ay=py-ny*10\n"
          "                        if nx>0.3:rx=ax;align=QtCore.Qt.AlignLeft\n"
          "                        elif nx<-0.3:rx=ax-117;align=QtCore.Qt.AlignRight\n"
          "                        else:rx=ax-58;align=QtCore.Qt.AlignHCenter\n"
          "                        if ny>0.3:ry=ay-24\n"
          "                        elif ny<-0.3:ry=ay\n"
          "                        else:ry=ay-12\n"
          "                        painter.drawText(QtCore.QRectF(rx,ry,117,24),int(align|QtCore.Qt.AlignVCenter),text)\n"
          "                        continue\n"
          "                    labelrect=QtCore.QRectF(px-125 if side=='left' else px+8,py-12,117,24)\n"
          "                    painter.drawText(labelrect,int(QtCore.Qt.AlignRight if side=='left' else QtCore.Qt.AlignLeft),text)")
          for base in (root+'/DeltaEngineering', root+'/package/Mod/DeltaEngineering/DeltaEngineering'):
              p=base+'/drafting.py';s=open(p,encoding='utf-8').read();assert DR_OLD in s
              open(p,'w',encoding='utf-8').write(s.replace(DR_OLD,DR_NEW))
              p=base+'/export.py';s=open(p,encoding='utf-8').read();assert EX_OLD in s
              open(p,'w',encoding='utf-8').write(s.replace(EX_OLD,EX_NEW))
              print('v4 patched',base)

          PY
          mkdir -p patches/v6
          cat > patches/v6/apply_v6.py <<'PY'
          """Delta Engineering v6 patches: applies v4 first, then dock layout fixes (scroll-wrapped panels, tabified editor docks)."""
          import sys,os,subprocess
          root=sys.argv[1]
          here=os.path.dirname(os.path.abspath(__file__))
          subprocess.check_call([sys.executable,os.path.join(here,'..','v4','apply_v4.py'),root])
          def rep(rel,old,new):
              for base in (root+'/DeltaEngineering', root+'/package/Mod/DeltaEngineering/DeltaEngineering'):
                  p=os.path.join(base,rel)
                  s=open(p,encoding='utf-8',newline='').read()
                  assert s.count(old)==1,(p,old,s.count(old))
                  open(p,'w',encoding='utf-8',newline='').write(s.replace(old,new))
          SC="_sc=QtWidgets.QScrollArea();_sc.setWidgetResizable(True);_sc.setFrameShape(QtWidgets.QFrame.NoFrame);_sc.setWidget(%s);self.setWidget(_sc)"
          rep('drafting_panel.py',"shell=QtWidgets.QWidget();self.setWidget(shell);","shell=QtWidgets.QWidget();"+SC%'shell'+";")
          rep('drafting_panel.py',"panel=DraftingPanel();Gui.getMainWindow().addDockWidget(QtCore.Qt.RightDockWidgetArea,panel);panel.show();","panel=DraftingPanel();Gui.getMainWindow().addDockWidget(QtCore.Qt.RightDockWidgetArea,panel);_other=Gui.getMainWindow().findChild(QtWidgets.QDockWidget,'DeltaElectricalPanel');(Gui.getMainWindow().tabifyDockWidget(_other,panel) if _other else None);panel.show();panel.raise_();")
          rep('panel.py',"area=QtWidgets.QWidget();self.setWidget(area)","area=QtWidgets.QWidget();"+SC%'area')
          rep('panel.py',"Gui.getMainWindow().addDockWidget(QtCore.Qt.RightDockWidgetArea,panel)","Gui.getMainWindow().addDockWidget(QtCore.Qt.RightDockWidgetArea,panel);_other=Gui.getMainWindow().findChild(QtWidgets.QDockWidget,'DeltaDraftingPanel');(Gui.getMainWindow().tabifyDockWidget(_other,panel) if _other else None);panel.raise_()")
          print('v6 patch applied')
          PY
          python patches/v6/apply_v6.py C:/delta/DeltaEngineering
          cd /c && diff -ru delta_orig delta/DeltaEngineering > /c/v4.patch || true
          wc -l /c/v4.patch
      - name: Stage official FreeCAD 1.1.4 plus Delta addon (offline bundle)
        shell: pwsh
        run: |
          $base = 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4'
          $name = 'FreeCAD_1.1.4-Windows-x86_64-py311-installer.exe'
          Invoke-WebRequest "$base/$name" -OutFile C:/fc.exe -UseBasicParsing
          $want = (([string](Invoke-RestMethod "$base/$name-SHA256.txt")) -split '\s+')[0]
          $got = (Get-FileHash C:/fc.exe -Algorithm SHA256).Hash
          if ($got -ine $want) { throw "SHA256 mismatch" }
          "FreeCAD installer SHA256 verified: $got"
          $p = Start-Process C:/fc.exe -ArgumentList '/S','/D=C:\stagebase' -Wait -PassThru
          "official installer exit $($p.ExitCode)"
          $exe = Get-ChildItem C:/stagebase -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          "root $root"
          New-Item -ItemType Directory C:/stage -Force | Out-Null
          Copy-Item "$root/*" C:/stage -Recurse -Force
          Get-ChildItem C:/stage -Filter 'Uninstall*' -ErrorAction SilentlyContinue | Remove-Item -Force
          New-Item -ItemType Directory C:/stage/Mod -Force | Out-Null
          Copy-Item C:/delta/DeltaEngineering/package/Mod/DeltaEngineering C:/stage/Mod/DeltaEngineering -Recurse -Force
          Copy-Item C:/delta/DeltaEngineering/LaunchDelta.FCMacro C:/stage/LaunchDelta.FCMacro -Force
          @'
          Delta Engineering v6 offline installer (unsigned, experimental).
          Contains: FreeCAD 1.1.4 (LGPL-2.1-or-later, https://github.com/FreeCAD/FreeCAD/releases/tag/1.1.4 , source at the same tag),
          and the Delta Engineering Python addon (GPL-3.0-or-later, see Mod\\DeltaEngineering\\COPYING if present).
          Not certified for engineering use. Drawings are illustrative.

          '@ | Set-Content C:/stage/DELTA-NOTICE.txt -Encoding utf8
          $sz = (Get-ChildItem C:/stage -Recurse -File | Measure-Object Length -Sum).Sum
          "staged size MB $([math]::Round($sz/1MB))"
      - name: Build offline installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'ISCC not found' }
          @'
          [Setup]
          AppName=Delta Engineering
          AppVersion=5
          AppPublisher=Delta Engineering (unsigned build)
          DefaultDirName={localappdata}\Programs\DeltaEngineering
          DefaultGroupName=Delta Engineering
          PrivilegesRequired=lowest
          Compression=lzma2/fast
          SolidCompression=yes
          OutputDir=C:\out
          OutputBaseFilename=DeltaEngineering-Setup-v6
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          UninstallDisplayName=Delta Engineering
          [Files]
          Source: "C:\stage\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Delta Engineering"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          Name: "{autodesktop}\Delta Engineering"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; Description: "Start Delta Engineering"; Flags: postinstall nowait skipifsilent unchecked

          '@ | Set-Content C:/delta.iss -Encoding ascii
          & $iscc C:/delta.iss 2>&1 | Select-Object -Last 15
          Get-Item C:/out/DeltaEngineering-Setup-v6.exe | Select-Object Name,Length
          (Get-FileHash C:/out/DeltaEngineering-Setup-v6.exe -Algorithm SHA256).Hash
      - name: Add Mesa llvmpipe software OpenGL (CI only)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
      - name: Block all outbound network, then install offline as the setup exe
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName blockout -Direction Outbound -Action Block -Profile Any | Out-Null
          try { Invoke-WebRequest https://github.com -TimeoutSec 8 -UseBasicParsing | Out-Null; "network STILL reachable" } catch { "network blocked OK" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process C:/out/DeltaEngineering-Setup-v6.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DeltaTest' -Wait -PassThru
          "setup exit $($p.ExitCode) seconds $($sw.Elapsed.TotalSeconds)"
          $sz = (Get-ChildItem C:/DeltaTest -Recurse -File | Measure-Object Length -Sum).Sum
          "installed size MB $([math]::Round($sz/1MB))"
          "addon present: $(Test-Path C:/DeltaTest/Mod/DeltaEngineering/InitGui.py)"
          "shortcut: $(Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Delta Engineering.lnk")"
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'
          @('import FreeCAD, DeltaEngineering.core, DeltaEngineering.domain','print("addon import ok with network blocked")') | Set-Content C:/off.py -Encoding utf8
          & $cmd.FullName C:/off.py 2>&1 | Out-String
          Remove-NetFirewallRule -DisplayName blockout
          try { Invoke-WebRequest https://github.com -TimeoutSec 15 -UseBasicParsing | Out-Null; "network restored" } catch { "network still blocked?" }
      - name: Regression on installed build with patched source, 1e-6 mm tolerance in test copy
        shell: bash
        run: |
          grep -rl 'read_text()' /c/delta/DeltaEngineering/tests | xargs sed -i "s/read_text()/read_text(encoding='utf-8')/g"
          grep -rl '/tmp/cad-development' /c/delta/DeltaEngineering/tests | xargs -r sed -i 's#/tmp/cad-development#C:/delta/DeltaEngineering#g'
          python - <<'PY'
          p='C:/delta/DeltaEngineering/tests/measurement.py'
          s=open(p,encoding='utf-8').read()
          old="report['items'][0]['bounds_mm']['min']==[50.0,210.0,0.0]"
          new="all(abs(a-b)<1e-6 for a,b in zip(report['items'][0]['bounds_mm']['min'],[50.0,210.0,0.0]))"
          assert old in s
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          PY
          cmd=$(find /c/DeltaTest -name FreeCADCmd.exe | head -1)
          PYTHONUTF8=1 python C:/delta/DeltaEngineering/development/run_regression.py --runtime "$cmd" --timeout 240 || true
          mkdir -p dist/v6
          cp C:/delta/DeltaEngineering/evidence/developer-regression.json dist/v6/regression-v6.json
          python -c "import json;d=json.load(open('dist/v6/regression-v6.json'));print('all_passed',d['all_passed'],len(d['results']),[r['suite'] for r in d['results'] if not r['passed']])"
      - name: Copy Mesa into installed app (CI only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $bin = $exe.Directory.FullName
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
      - name: Drive v6 GUI checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/shots6b | Out-Null
          $macro = @'
          import os, json, traceback
          OUT = 'C:/shots6b'
          os.makedirs(OUT, exist_ok=True)
          res = {'steps': {}, 'dialogs': [], 'done': False}
          def save():
              open(OUT + '/gui-result6.json', 'w', encoding='utf-8').write(json.dumps(res, ensure_ascii=False, indent=1, default=str))
          try:
              import FreeCAD as App, FreeCADGui as Gui
              from PySide import QtCore, QtWidgets
              import DeltaEngineering.core, DeltaEngineering.domain
              from DeltaEngineering.gui import register
              if 'DeltaWorkbench' not in Gui.listWorkbenches(): register()
              Gui.activateWorkbench('DeltaWorkbench')
              queue = []
              counter = [0]
              def handle():
                  w = QtWidgets.QApplication.activeModalWidget()
                  if not w: return
                  counter[0] += 1
                  info = {'n': counter[0], 'cls': type(w).__name__, 'title': w.windowTitle()}
                  try:
                      w.grab().save(OUT + '/dlg-%02d.png' % counter[0])
                  except Exception:
                      pass
                  try:
                      if isinstance(w, QtWidgets.QInputDialog):
                          info['label'] = w.labelText()
                          if not queue:
                              info['note'] = 'unexpected dialog, rejected'
                              w.reject()
                              res['dialogs'].append(info); save(); return
                          v = queue.pop(0)
                          info['entered'] = v
                          if isinstance(v, str): w.setTextValue(v)
                          else: w.setDoubleValue(v)
                          w.accept()
                      elif isinstance(w, QtWidgets.QMessageBox):
                          info['text'] = w.text()
                          yes = [b for b in w.findChildren(QtWidgets.QPushButton) if b.text() in ('نعم', 'Yes', '&Yes')]
                          if yes: yes[0].click()
                          else: w.accept()
                      else:
                          info['note'] = 'other dialog accepted'
                          tb = w.findChild(QtWidgets.QTableWidget)
                          if tb is not None:
                              info['table'] = [[(tb.item(r, c).text() if tb.item(r, c) else '') for c in range(tb.columnCount())] for r in range(tb.rowCount())]
                          w.accept()
                  except Exception:
                      info['handler_error'] = traceback.format_exc()
                  res['dialogs'].append(info); save()
              t = QtCore.QTimer(); t.setInterval(400); t.timeout.connect(handle); t.start()
              def shot(name):
                  try:
                      Gui.getMainWindow().grab().save(OUT + '/' + name + '.png')
                  except Exception:
                      res['steps'][name + '_shot_error'] = traceback.format_exc()
              def fit():
                  try:
                      v = Gui.activeDocument().activeView(); v.viewAxonometric(); v.fitAll()
                  except Exception: pass
              def run(name, fn):
                  try:
                      out = fn()
                      res['steps'][name] = {'ok': True, 'detail': out}
                  except Exception:
                      res['steps'][name] = {'ok': False, 'detail': traceback.format_exc()}
                  save()
              def step():
                  mw = Gui.getMainWindow()
                  def s_measure():
                      Gui.runCommand('Delta_Demo')
                      d = App.ActiveDocument
                      Gui.Selection.clearSelection(); Gui.Selection.addSelection(d.InletPipe)
                      Gui.runCommand('Delta_MeasureSelection')
                      rows = [x for x in res['dialogs'] if 'table' in x][-1]['table']
                      txt = ' | '.join(' / '.join(r) for r in rows)
                      assert 'خط المركز' in txt, txt
                      assert 'مجموع' in txt, txt
                      return rows
                  run('measure_labels_distinguish_edge_sum_from_centerline', s_measure)
                  def s_layout():
                      out = {}
                      from DeltaEngineering.drafting_panel import show_panel
                      from DeltaEngineering.panel import show_panel as eshow
                      p = show_panel(); e = eshow()
                      for (w, h) in ((1366, 768), (1920, 1080)):
                          mw.showNormal(); mw.resize(w, h)
                          QtWidgets.QApplication.processEvents()
                          mdi = mw.findChild(QtWidgets.QMdiArea)
                          out['%dx%d' % (w, h)] = {'window': [mw.width(), mw.height()], 'viewport_width': mdi.width() if mdi else None, 'viewport_height': mdi.height() if mdi else None}
                          mw.grab().save(OUT + '/func4-layout-%dx%d.png' % (w, h))
                      return out
                  run('layout_both_editors_docked_laptop_and_fullhd', s_layout)
                  def s_dims():
                      from DeltaEngineering.drafting_panel import show_panel
                      Gui.runCommand('Delta_NewProject')
                      p = show_panel()
                      for (r, c, v) in ((0, 0, '0'), (1, 0, '1000'), (1, 1, '0'), (2, 0, '1000'), (2, 1, '600')):
                          p.table.item(r, c).setText(v)
                      def click(text):
                          b = [x for x in p.findChildren(QtWidgets.QPushButton) if x.text() == text][0]
                          b.click(); QtWidgets.QApplication.processEvents()
                      click('رسم مسار جديد')
                      s1 = p.status.text()
                      p.start.setValue(1); p.end.setValue(2); p.offset.setValue(150)
                      click('إضافة بعد مرتبط')
                      s2 = p.status.text()
                      p.start.setValue(2); p.end.setValue(3)
                      click('إضافة بعد مرتبط')
                      s3 = p.status.text()
                      d = App.ActiveDocument
                      dims = [o for o in d.Objects if 'Dimension' in o.TypeId or 'Dimension' in o.Name]
                      QtWidgets.QFileDialog.getSaveFileName = staticmethod(lambda *a, **k: (OUT + '/dims.pdf', 'PDF (*.pdf)'))
                      click('إخراج الرسم والأبعاد PDF')
                      s4 = p.status.text()
                      sz = os.path.getsize(OUT + '/dims.pdf') if os.path.exists(OUT + '/dims.pdf') else None
                      assert dims and sz, (dims, sz, s4)
                      mw.grab().save(OUT + '/func4-dimensions.png')
                      return {'status_after_draw': s1, 'status_dim1': s2, 'status_dim2': s3, 'dimension_objects': [o.Name for o in dims], 'status_export': s4, 'pdf_bytes': sz}
                  run('manual_table_points_linked_dimensions_pdf', s_dims)
                  def scenario(tag, off, pts):
                      from DeltaEngineering.drafting_panel import show_panel
                      Gui.runCommand('Delta_NewProject')
                      p = show_panel()
                      for i, (x, y) in enumerate(pts):
                          for c, v in ((0, x), (1, y), (2, 0)):
                              p.table.item(i, c).setText(str(v))
                      def click(text):
                          b = [x for x in p.findChildren(QtWidgets.QPushButton) if x.text() == text][0]
                          b.click(); QtWidgets.QApplication.processEvents()
                      click('رسم مسار جديد')
                      stat = []
                      for a, b in ((1, 2), (2, 3)):
                          p.start.setValue(a); p.end.setValue(b); p.offset.setValue(off)
                          click('إضافة بعد مرتبط'); stat.append(p.status.text())
                      QtWidgets.QFileDialog.getSaveFileName = staticmethod(lambda *a, **k: (OUT + '/dims-' + tag + '.pdf', 'PDF (*.pdf)'))
                      click('إخراج الرسم والأبعاد PDF')
                      return {'dims': stat, 'export': p.status.text(), 'pdf_bytes': os.path.getsize(OUT + '/dims-' + tag + '.pdf')}
                  for tag, off, pts in (('A', 150, ((0,0),(1000,0),(1000,600))), ('B', -150, ((0,0),(1000,0),(1000,600))), ('C', 150, ((0,0),(-800,0),(-800,-500))), ('D', 150, ((0,0),(800,600),(1600,0))), ('E', -150, ((0,0),(800,600),(1600,0))), ('F', 150, ((0,0),(700,-500),(0,-900))), ('G', -150, ((0,0),(700,-500),(0,-900)))):
                      run('dims_' + tag, lambda tag=tag, off=off, pts=pts: scenario(tag, off, pts))
                  res['done'] = True; save()
              QtCore.QTimer.singleShot(6000, step)
          except Exception:
              res['error'] = traceback.format_exc(); res['done'] = True; save()
          '@
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          Set-Content "$root\DeltaGuiTest6.FCMacro" $macro -Encoding utf8
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:MESA_GL_VERSION_OVERRIDE = '4.5'
          Start-Process $exe.FullName -ArgumentList "`"$root\DeltaGuiTest6.FCMacro`""
          $t = 0
          while ($t -lt 500) { Start-Sleep 5; $t += 5; if ((Test-Path C:/shots6b/gui-result6.json) -and (Select-String -Path C:/shots6b/gui-result6.json -Pattern '"done": true' -Quiet)) { break } }
          Start-Sleep 3
          if (Test-Path C:/shots6b/gui-result6.json) { Get-Content C:/shots6b/gui-result6.json } else { 'no result json' }
          exit 0
      - name: Unblock network, render and check PDFs
        shell: pwsh
        run: |
          pip install pymupdf 2>&1 | Select-Object -Last 1
          exit 0
      - name: Render PDFs and check label/line crossings
        shell: pwsh
        run: |
          pip install pymupdf 2>&1 | Select-Object -Last 1
          @'
          import fitz,glob,json
          out={}
          for f in sorted(glob.glob('C:/shots6b/dims-*.pdf')):
              page=fitz.open(f).load_page(0)
              page.get_pixmap(dpi=130).save(f.replace('.pdf','-page1.png'))
              words=page.get_text('words')
              labels=[]
              for i,w in enumerate(words):
                  if w[4]=='mm' and i>0:
                      n=words[i-1]
                      labels.append((n[4],fitz.Rect(n[:4])|fitz.Rect(w[:4])))
              segs=[]
              for d in page.get_drawings():
                  for it in d['items']:
                      if it[0]=='l': segs.append((it[1],it[2]))
                      elif it[0]=='re':
                          r=it[1]; segs += [(r.tl,r.tr),(r.tr,r.br),(r.br,r.bl),(r.bl,r.tl)]
              def hit(rect,a,b):
                  # sample points along segment, shrink rect slightly
                  r=fitz.Rect(rect.x0+1,rect.y0+1,rect.x1-1,rect.y1-1)
                  for k in range(0,101):
                      t=k/100; x=a.x+(b.x-a.x)*t; y=a.y+(b.y-a.y)*t
                      if r.contains(fitz.Point(x,y)): return True
                  return False
              res=[]
              for name,rect in labels:
                  crossed=[(round(a.x,1),round(a.y,1),round(b.x,1),round(b.y,1)) for a,b in segs if hit(rect,a,b)]
                  res.append({'label':name+' mm','rect':[round(v,1) for v in rect],'crossing_lines':crossed})
              out[f.split('/')[-1]]=res
          json.dump(out,open('C:/shots6b/label-check.json','w'),indent=1)
          print(json.dumps(out,indent=1))
          bad=[k for k,v in out.items() for l in v if l['crossing_lines']]
          print('labels found:',sum(len(v) for v in out.values()),'crossed:',bad)

          '@ | Set-Content C:/check.py -Encoding utf8
          python C:/check.py
          exit 0
      - name: Publish installer as private release asset and commit evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git pull --rebase || true
          mkdir -p dist/v6 patches/v6
          sha256sum /c/out/DeltaEngineering-Setup-v6.exe | tee dist/v6/DeltaEngineering-Setup-v6.exe.sha256
          cp /c/shots6b/*.png /c/shots6b/gui-result6.json /c/shots6b/label-check.json /c/shots6b/*.pdf dist/v6/ || true
          cp patches/v4/apply_v4.py patches/v6/ || true
          git add dist patches
          git commit -m "Add v6 standalone installer evidence" || true
          git push
          gh release create standalone-v6 /c/out/DeltaEngineering-Setup-v6.exe --title "Delta Engineering v6 offline installer (unsigned, experimental)" --notes "Offline installer bundling FreeCAD 1.1.4 + Delta addon. See dist/v6 for CI evidence. Not certified." || echo "release failed"
