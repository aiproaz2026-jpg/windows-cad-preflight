name: Build v21bm (route fittings, valves, pump, schedules) standalone offline installer and verify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v17:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Write v12 patch files (electrical per-terminal side)
        shell: bash
        run: |
          mkdir -p patches/v12
          echo '' | base64 -d > patches/v12/apply_v12.py
          echo '' | base64 -d > patches/v12/routecheck.py
          echo '' | base64 -d > patches/v12/elec_test.py
      - name: Unpack v58 source and apply patches/v12 chain (v3 to v12)
        shell: bash
        run: |
          mkdir -p /c/delta /c/out
          unzip -q src/*DeltaEngineering-development-source-v58-10539385.zip -d /c/delta
          python patches/v12/apply_v12.py C:/delta/DeltaEngineering
          git rev-parse HEAD | tee /c/out/source-revision.txt
          sha256sum src/*DeltaEngineering-development-source-v58-10539385.zip patches/v7/*.py patches/v6/*.py patches/v4/*.py patches/v3/*.py | tee -a /c/out/source-revision.txt
      - name: Apply v16 patches (page layout, label side, contactor marks, on-screen identifiers)
        shell: bash
        run: |
          mkdir -p patches/v16
          echo '' | base64 -d > patches/v16/patch_export2.py
          echo '' | base64 -d > patches/v16/patch_export3.py
          echo '' | base64 -d > patches/v16/identifiers.py
          M=C:/delta/DeltaEngineering/package/Mod/DeltaEngineering
          python patches/v16/patch_export2.py $M/DeltaEngineering/export.py
          python patches/v16/patch_export3.py $M/DeltaEngineering/export.py
          cp patches/v16/identifiers.py $M/DeltaEngineering/identifiers.py
          printf '\ntry:\n    from DeltaEngineering.identifiers import install as _delta_ids\n    from PySide import QtCore as _delta_qc\n    _delta_qc.QTimer.singleShot(2000, _delta_ids)\nexcept Exception:\n    pass\n' >> $M/InitGui.py
          tail -8 $M/InitGui.py
      - name: Apply v16 patches (paired pole rows, per-terminal leads, three-pole breaker, Tasks panel toolbar button)
        shell: bash
        run: |
          mkdir -p patches/v16
          echo '' | base64 -d > patches/v16/patch_export4.py
          echo '' | base64 -d > patches/v16/patch_export5.py
          echo '' | base64 -d > patches/v16/identifiers.py
          M=C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/DeltaEngineering
          python patches/v16/patch_export4.py $M/symbols.py
          python patches/v16/patch_export5.py $M/core.py $M/symbols.py $M/export.py
          cp patches/v16/identifiers.py $M/identifiers.py
          python -m py_compile $M/core.py $M/symbols.py $M/export.py $M/identifiers.py && echo v16 patches compile ok
      - name: Apply v17 patches (drafting v10, parts library, fittings library)
        shell: bash
        run: |
          M=C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/DeltaEngineering
          ls $M/drafting.py
          cp patches/v58/drafting_v11.py $M/drafting.py
          cp patches/v49/parts_library.py $M/parts_library.py
          cp patches/v48/fittings_library.py $M/fittings_library.py
          cp patches/v50/library_commands.py $M/library_commands.py
          cat patches/v50/initgui_append.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          tail -8 C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          cp patches/v51/ar_dict.py $M/ar_dict.py
          cp patches/v54/ar_layer.py patches/v54/ar_dict2.py patches/v54/ar_dict3.py $M/
          cp patches/v59/ar_dict4.py $M/
          cp patches/v77/ar_layer.py patches/v61/ar_props.py $M/
          cp patches/v77/ar_dict5.py $M/ar_dict5.py
          cp patches/v60/elec_lib_data.py $M/elec_lib_data.py
          cp patches/v62/minipdf.py $M/minipdf.py
          cp patches/v66/elec_libedit.py $M/elec_libedit.py
          cp patches/v71/term_ends.py $M/term_ends.py
          cat patches/v67/initgui_append8.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python -m py_compile $M/term_ends.py
          cp patches/v101/term_ends2.py $M/term_ends2.py
          cat patches/v75/term2/initgui_te2.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python -m py_compile $M/term_ends2.py
          cp patches/v102/wire_route.py $M/wire_route.py
          python patches/v102/core_callsite_patch.py $M/core.py
          cp patches/v102/wire_reroute_cmd.py $M/wire_reroute_cmd.py
          cat patches/v102/initgui_wr.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python -m py_compile $M/wire_route.py $M/wire_reroute_cmd.py $M/core.py && echo wire route build patches compile ok
          cp patches/v78/iec_full/elec_lib_iec_full.py $M/elec_lib_iec_full.py
          cp patches/v78/iec45/elec_lib_iec4.py $M/elec_lib_iec4.py
          cp patches/v78/iec45/elec_sig_meter.py $M/elec_sig_meter.py
          python -m py_compile $M/elec_lib_iec_full.py $M/elec_lib_iec4.py $M/elec_sig_meter.py
          cat patches/v66/initgui_append7.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python -m py_compile $M/elec_libedit.py
          cp patches/v63/network.py patches/v63/net_commands.py $M/
          cat patches/v63/initgui_append6.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          cp patches/v68/net_export.py $M/net_export.py
          cat patches/v68/initgui_append9.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python -m py_compile $M/net_export.py
          python -m py_compile $M/network.py $M/net_commands.py
          cat patches/v60/symbols_append2.py >> $M/symbols.py
          cat patches/v78/iec_full/symbols_append_full.py >> $M/symbols.py
          cat patches/v78/iec45/symbols_append_iec4.py >> $M/symbols.py
          cat patches/v78/iec45/symbols_append_sig.py >> $M/symbols.py
          python -m py_compile $M/symbols.py $M/elec_lib_data.py
          cat patches/v51/initgui_append2.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          sed -i "s/ | Mechanical'/'/; s/ | Piping'/'/; s/ | Electrical'/'/" $M/core.py
          cp patches/v52/fittings3d.py patches/v52/fit_commands.py patches/v52/brand.py $M/
          cat patches/v52/initgui_append3.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          python patches/v52/rename.py $M
          cp patches/v53/fittings3d.py patches/v53/equipment3d.py patches/v53/eq_commands.py $M/
          cp patches/v57/threads3d.py patches/v57/thr_commands.py $M/
          cat patches/v53/initgui_append4.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          cat patches/v57/initgui_append5.txt >> C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/InitGui.py
          grep -n "root.Label\|piping.Label\|electrical.Label" $M/core.py
          python -m py_compile $M/drafting.py $M/parts_library.py $M/fittings_library.py $M/library_commands.py $M/ar_dict.py $M/ar_dict2.py $M/ar_dict3.py $M/ar_dict4.py $M/ar_dict5.py $M/ar_props.py $M/ar_layer.py $M/core.py $M/fittings3d.py $M/fit_commands.py $M/brand.py $M/equipment3d.py $M/eq_commands.py $M/threads3d.py $M/thr_commands.py $M/gui.py $M/export.py && echo v17 patches compile ok
          sha256sum $M/drafting.py $M/parts_library.py $M/fittings_library.py | tee -a /c/out/source-revision.txt
      - name: Import check of patched package with plain python syntax compile
        shell: bash
        run: |
          python -m compileall -q C:/delta/DeltaEngineering/package/Mod/DeltaEngineering && echo "compile ok"
          ls C:/delta/DeltaEngineering/package/Mod/DeltaEngineering/DeltaEngineering/*.py | wc -l
      - name: Stage official FreeCAD 1.1.4 plus Delta addon (offline bundle)
        shell: pwsh
        run: |
          $base = 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4'
          $name = 'FreeCAD_1.1.4-Windows-x86_64-py311-installer.exe'
          Invoke-WebRequest "$base/$name" -OutFile C:/fc.exe -UseBasicParsing
          $want = (([string](Invoke-RestMethod "$base/$name-SHA256.txt")) -split '\s+')[0]
          $got = (Get-FileHash C:/fc.exe -Algorithm SHA256).Hash
          if ($got -ine $want) { throw "SHA256 mismatch" }
          "FreeCAD installer SHA256 verified: $got"
          $p = Start-Process C:/fc.exe -ArgumentList '/S','/D=C:\stagebase' -Wait -PassThru
          "official installer exit $($p.ExitCode)"
          $exe = Get-ChildItem C:/stagebase -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory C:/stage -Force | Out-Null
          Copy-Item "$root/*" C:/stage -Recurse -Force
          Get-ChildItem C:/stage -Filter 'Uninstall*' -ErrorAction SilentlyContinue | Remove-Item -Force
          New-Item -ItemType Directory C:/stage/Mod -Force | Out-Null
          Copy-Item C:/delta/DeltaEngineering/package/Mod/DeltaEngineering C:/stage/Mod/DeltaEngineering -Recurse -Force
          Copy-Item C:/delta/DeltaEngineering/LaunchDelta.FCMacro C:/stage/LaunchDelta.FCMacro -Force
          Copy-Item C:/out/source-revision.txt C:/stage/DELTA-SOURCE-REVISION.txt -Force
          @'
          Delta Engineering v16 offline installer (unsigned, experimental, NOT certified for engineering use).
          Contains: FreeCAD 1.1.4 (LGPL-2.1-or-later, https://github.com/FreeCAD/FreeCAD/releases/tag/1.1.4 , source at the same tag),
          and the Delta Engineering Python addon (GPL-3.0-or-later).
          Generic fittings and electrical symbols are illustrative geometry. Drawings are geometric drafts.
          Full license inventory is NOT complete yet.

          '@ | Set-Content C:/stage/DELTA-NOTICE.txt -Encoding utf8
          @'
          # Delta Engineering launcher: activates the Delta workbench and closes FreeCAD's stock Start tab. It never hides or moves any panel.
          import FreeCAD as App
          import FreeCADGui as Gui
          import DeltaEngineering.core
          import DeltaEngineering.domain
          from DeltaEngineering.gui import register
          if 'DeltaWorkbench' not in Gui.listWorkbenches(): register()
          Gui.activateWorkbench('DeltaWorkbench')
          try:
              try:
                  from PySide6 import QtWidgets, QtCore
              except Exception:
                  from PySide import QtWidgets, QtCore
              def _close_start():
                  for sw in Gui.getMainWindow().findChildren(QtWidgets.QMdiSubWindow):
                      w = sw.widget()
                      cn = w.metaObject().className() if w is not None else ''
                      if 'StartView' in cn or (sw.windowTitle().strip() == 'Start' and not App.listDocuments()):
                          sw.close()
              for ms in (1500, 4000, 8000):
                  QtCore.QTimer.singleShot(ms, _close_start)
          except Exception as e:
              App.Console.PrintWarning('Delta launcher: ' + str(e) + '\n')
          '@ | Set-Content C:/stage/LaunchDelta.FCMacro -Encoding utf8
          New-Item -ItemType Directory C:/stage/DeltaDefaults -Force | Out-Null
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="no" ?>
          <FCParameters>
            <FCParamGroup Name="Root">
              <FCParamGroup Name="BaseApp">
                <FCParamGroup Name="Preferences">
                  <FCParamGroup Name="General">
                    <FCText Name="Language">Arabic</FCText>
                  </FCParamGroup>
                </FCParamGroup>
              </FCParamGroup>
            </FCParamGroup>
          </FCParameters>
          '@ | Set-Content C:/stage/DeltaDefaults/user.cfg -Encoding utf8
          $sz = (Get-ChildItem C:/stage -Recurse -File | Measure-Object Length -Sum).Sum
          "staged size MB $([math]::Round($sz/1MB))"
      - name: Generate THIRD-PARTY-NOTICES index from the staged payload
        shell: pwsh
        run: |
          $root = 'C:/stage'
          $pat = '^(license|licence|copying|notice|notices|copyright|authors|unlicense|patents)([._-].*)?$|^(license|licence|copying)'
          $files = Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -match $pat -and $_.Length -lt 2MB }
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add('THIRD-PARTY NOTICES INDEX / فهرس إشعارات المكوّنات الخارجية')
          $out.Add('This program bundles FreeCAD (LGPL-2.1-or-later), OpenCASCADE (LGPL-2.1 with exception), Python, Qt (LGPL-3.0), and other open-source components.')
          $out.Add('This file is an automatically generated index of the licence and notice files found inside the installed payload. It is NOT a legal opinion and NOT a complete licence review.')
          $out.Add('Each listed file is shipped unchanged in the installation folder at the path shown. Count: ' + $files.Count)
          $out.Add('')
          foreach ($f in ($files | Sort-Object FullName)) {
            $bs = [string][char]92; $rel = $f.FullName.Substring($root.Length).Replace($bs,'/').TrimStart('/')
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.Substring(0,16)
            $first = ''
            try { $first = ((Get-Content $f.FullName -TotalCount 3 -ErrorAction Stop) -join ' ').Trim(); if ($first.Length -gt 100) { $first = $first.Substring(0,100) } } catch {}
            $out.Add($rel + ' | ' + $f.Length + ' bytes | sha256:' + $h + ' | ' + $first)
          }
          $out | Set-Content C:/stage/THIRD-PARTY-NOTICES.txt -Encoding utf8
          New-Item -ItemType Directory -Force C:/seed | Out-Null
          Copy-Item C:/stage/THIRD-PARTY-NOTICES.txt C:/seed/THIRD-PARTY-NOTICES.txt
          "notice files indexed: $($files.Count)"
          $total = (Get-ChildItem $root -Recurse -File | Measure-Object).Count
          "payload files: $total"
      - name: Build offline installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'ISCC not found' }
          @'
          [Setup]
          AppName=برنامج CAD للمهندس محمود زهير
          AppVersion=20
          AppPublisher=برنامج CAD للمهندس محمود زهير (نسخة غير موقّعة)
          DefaultDirName={localappdata}\Programs\DeltaEngineering
          DefaultGroupName=برنامج CAD للمهندس محمود زهير
          PrivilegesRequired=lowest
          Compression=lzma2/fast
          SolidCompression=yes
          OutputDir=C:\out
          OutputBaseFilename=CAD-Mahmoud-Zuhair-Setup-v21bm
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          UninstallDisplayName=برنامج CAD للمهندس محمود زهير
          [Messages]
          SetupAppTitle=تثبيت
          SetupWindowTitle=تثبيت - %1
          WelcomeLabel1=مرحباً بك في معالج تثبيت [name]
          WelcomeLabel2=سيتم تثبيت [name/ver] على جهازك. البرنامج تجريبي وغير موقّع رقمياً وغير معتمد للاستخدام الهندسي.
          ButtonBack=< &السابق
          ButtonNext=&التالي >
          ButtonInstall=&تثبيت
          ButtonCancel=إلغاء
          ButtonFinish=&إنهاء
          FinishedHeadingLabel=اكتمل تثبيت [name]
          FinishedLabelNoIcons=تم تثبيت [name] على جهازك.
          FinishedLabel=تم تثبيت [name] على جهازك. يمكنك تشغيله من الاختصار.
          [Files]
          Source: "C:\stage\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          Source: "C:\stage\DeltaDefaults\user.cfg"; DestDir: "{userappdata}\FreeCAD\v1-1"; Flags: onlyifdoesntexist uninsneveruninstall
          [Icons]
          Name: "{autoprograms}\برنامج CAD للمهندس محمود زهير"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          Name: "{autodesktop}\برنامج CAD للمهندس محمود زهير"; Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\bin\FreeCAD.exe"; Parameters: """{app}\LaunchDelta.FCMacro"""; Description: "تشغيل برنامج CAD للمهندس محمود زهير"; Flags: postinstall nowait skipifsilent unchecked

          '@ | Set-Content C:/delta.iss -Encoding utf8BOM
          & $iscc C:/delta.iss 2>&1 | Select-Object -Last 15
          Get-Item C:/out/CAD-Mahmoud-Zuhair-Setup-v21bm.exe | Select-Object Name,Length
          (Get-FileHash C:/out/CAD-Mahmoud-Zuhair-Setup-v21bm.exe -Algorithm SHA256).Hash
      - name: Add Mesa llvmpipe software OpenGL (CI only)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
      - name: Install silently as the setup exe (per-user, no admin) and check files
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process C:/out/CAD-Mahmoud-Zuhair-Setup-v21bm.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DeltaTest' -Wait -PassThru
          "setup exit $($p.ExitCode) seconds $($sw.Elapsed.TotalSeconds)"
          if ($p.ExitCode -ne 0) { throw 'setup failed' }
          $sz = (Get-ChildItem C:/DeltaTest -Recurse -File | Measure-Object Length -Sum).Sum
          "installed size MB $([math]::Round($sz/1MB))"
          "addon present: $(Test-Path C:/DeltaTest/Mod/DeltaEngineering/InitGui.py)"
          "fittings module present: $(Test-Path C:/DeltaTest/Mod/DeltaEngineering/DeltaEngineering/fittings.py)"
          "shortcut: $(Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/برنامج CAD للمهندس محمود زهير.lnk")"
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'Delta' } | ForEach-Object { "REGISTRY: $($_.DisplayName) | DisplayVersion=$($_.DisplayVersion) | $($_.InstallLocation)" }
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'
          $mods = 'core','domain','symbols','export','fittings','documents','scaled_output','tube_library','drafting','electrical','connectivity'
          $lines = @('import sys, FreeCAD, importlib','sys.path.insert(0, ''C:/DeltaTest/Mod'')','sys.path.insert(0, ''C:/DeltaTest/Mod/DeltaEngineering'')'); foreach ($m in $mods) { $lines += "try:`n    importlib.import_module('DeltaEngineering.$m'); print('OK $m')`nexcept Exception as e:`n    print('FAIL $m', repr(e))" }
          $lines | Set-Content C:/imp.py -Encoding utf8
          $o = & $cmd.FullName -c "exec(open('C:/imp.py',encoding='utf-8').read())" 2>&1 | Out-String; $o
          $okc = @([regex]::Matches($o, '(?m)^OK (\w+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique).Count
          "distinct OK imports: $okc"
          if ($okc -ne 11) { throw "import check: expected 11 OK, got $okc" }
          if ($o -match 'FAIL ') { throw 'import check failed' }
      - name: Copy Mesa into installed app (CI only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $bin = $exe.Directory.FullName
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
      - name: Run GUI macro (patches/v7/macro_gui_test.py) on the installed v12 at 1366x768
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/fit12 | Out-Null
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $root = $exe.Directory.Parent.FullName
          Copy-Item "$env:GITHUB_WORKSPACE/patches/v7/macro_gui_test.py" "$root\DeltaGuiTest12.FCMacro" -Force
          $env:DELTA_OUT = 'C:/fit12'; $env:GALLIUM_DRIVER = 'llvmpipe'; $env:MESA_GL_VERSION_OVERRIDE = '4.5'
          Start-Process $exe.FullName -ArgumentList "`"$root\DeltaGuiTest12.FCMacro`"" -RedirectStandardOutput C:/fit12/fc-out.txt -RedirectStandardError C:/fit12/fc-err.txt
          $t = 0
          while ($t -lt 420) { Start-Sleep 5; $t += 5; if ((Test-Path C:/fit12/gui-result12.json) -and (Select-String -Path C:/fit12/gui-result12.json -Pattern '"done": true' -Quiet)) { break } }
          if (-not (Test-Path C:/fit12/gui-result12.json) -or -not (Select-String -Path C:/fit12/gui-result12.json -Pattern '"done": true' -Quiet)) {
            try { Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size); $bmp.Save('C:/fit12/fit12-hang.png') } catch { "screenshot failed: $_" | Out-File C:/fit12/diag.txt -Append }
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName) | $($_.MainWindowTitle)" } | Out-File C:/fit12/diag.txt -Append
          }
          Start-Sleep 4; Get-Process FreeCAD -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - name: Electrical wiring route test on the installed v12 (headless FreeCAD)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/seed/elec | Out-Null
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'
          Copy-Item patches/v12/elec_test.py C:/elec_test.py -Force
          $o = & $cmd.FullName -c "exec(open('C:/elec_test.py',encoding='utf-8').read())" 2>&1 | Out-String
          $o | Set-Content C:/seed/elec/out.txt -Encoding utf8
          $o
      - name: Electrical symbol library test on the installed app (headless FreeCAD)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/seed/elec60 | Out-Null
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'
          Copy-Item patches/v60/elec60.py C:/elec60.py -Force
          $pr = Start-Process $cmd.FullName -ArgumentList "-c","exec(open('C:/elec60.py',encoding='utf-8').read())" -PassThru -RedirectStandardOutput C:/seed/elec60/out.txt -RedirectStandardError C:/seed/elec60/err.txt
          if (-not $pr.WaitForExit(240000)) { $pr.Kill(); "elec60 timeout" | Set-Content C:/seed/elec60/timeout.txt }
          Get-Content C:/seed/elec60/out.txt -ErrorAction SilentlyContinue
      - name: Electrical drawing sheet (motor starter A3 PDF) on the installed app (headless FreeCAD)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/seed/elecsheet | Out-Null
