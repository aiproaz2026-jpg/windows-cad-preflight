name: units, measurement, assembly and dimension checks run 30 on v16 (headless, ASCII install)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install v16 and run numeric checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory C:/diag3,C:/out -Force | Out-Null
          gh release download standalone-v16-r1 -p "DeltaEngineering-Setup-v16*.exe" -D C:/out
          $want = ((Get-Content dist/v16/DeltaEngineering-Setup-v16.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v16*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no asset matches SHA256' }
          "SHA256 MATCH" | Tee-Object C:/diag3/log.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DiagAscii16' -Wait -PassThru
          "setup exit $($p.ExitCode)" | Tee-Object -Append C:/diag3/log.txt
          [IO.File]::WriteAllBytes('C:/diag3/t3.py', [Convert]::FromBase64String(''))
          $env:DIAG_OUT = 'C:/diag3'
          $pr = Start-Process 'C:\DiagAscii16\bin\FreeCADCmd.exe' -ArgumentList 'C:\diag3\t3.py' -PassThru -RedirectStandardOutput C:/diag3/out.txt -RedirectStandardError C:/diag3/err.txt -WorkingDirectory C:/diag3 -NoNewWindow
          $fin = $pr.WaitForExit(240000)
          if (-not $fin) { Stop-Process -Id $pr.Id -Force; "TIMEOUT" | Tee-Object -Append C:/diag3/log.txt } else { "exit $($pr.ExitCode)" | Tee-Object -Append C:/diag3/log.txt }
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/diag30 | Out-Null
          foreach ($f in Get-ChildItem C:/diag3 -File) {
            if ($f.Extension -in '.pdf','.FCStd') { [IO.File]::WriteAllText("$PWD/dist/diag30/$($f.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))) }
            elseif ($f.Name -ne 't3.py') { Copy-Item $f.FullName ("dist/diag30/" + $f.Name) }
          }
          git add dist; git commit -m "Add units assembly dimension evidence" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
          
