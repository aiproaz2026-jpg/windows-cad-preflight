name: Combined mechanical retest run 50 (drafting v10 Z dims and PDF, gear fix) on v16c installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  item3:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download installer, verify SHA256, install, add Mesa (CI only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory C:/out,C:/seed -Force | Out-Null
          foreach ($t in "standalone-v16-r1") { gh release download $t -p "DeltaEngineering-Setup-v16*.exe" -D C:/out; if ($LASTEXITCODE -eq 0) { break } }
          $want = ((Get-Content dist/v16/DeltaEngineering-Setup-v16.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v16*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no downloaded asset matches the dist/v16 SHA256' }
          "SHA256 MATCH $ok" | Tee-Object C:/seed/log.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "setup exit $($p.ExitCode)" | Tee-Object -Append C:/seed/log.txt
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          Get-ChildItem $app -Directory | Select-Object -ExpandProperty Name | Tee-Object -Append C:/seed/log.txt
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
          
      - name: Stage g48 macro template
        shell: pwsh
        run: |
          [IO.File]::WriteAllText('C:/seed/g48.tpl', [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')), (New-Object Text.UTF8Encoding $false))
      - name: GUI dimension export and assembly
        shell: pwsh
        run: |
          $app0 = "$env:LOCALAPPDATA\Programs\DeltaEngineering"
          $df = Get-ChildItem $app0 -Recurse -Filter drafting.py | Select-Object -First 1
          "drafting.py at $($df.FullName)" | Tee-Object -Append C:/seed/log.txt
          Copy-Item $df.FullName C:/seed/drafting_orig_installed.py.txt
          [IO.File]::WriteAllBytes($df.FullName, [Convert]::FromBase64String(''))
          $mt = [IO.File]::ReadAllText('C:/seed/g48.tpl', (New-Object Text.UTF8Encoding $false))
          $out = "C:/seed/g48"; New-Item -ItemType Directory $out -Force | Out-Null
          $mm = $mt.Replace('@@OUT@@', $out)
          [IO.File]::WriteAllText("C:/seed/gui48.FCMacro", $mm, (New-Object Text.UTF8Encoding $false))
          $env:GALLIUM_DRIVER = 'llvmpipe'; $env:MESA_GL_VERSION_OVERRIDE = '4.5'
          $pr = Start-Process "$env:LOCALAPPDATA\Programs\DeltaEngineering\bin\FreeCAD.exe" -ArgumentList "C:\seed\gui48.FCMacro" -WorkingDirectory "$env:LOCALAPPDATA\Programs\DeltaEngineering" -PassThru -RedirectStandardError "C:/seed/err48.txt" -RedirectStandardOutput "C:/seed/stdout48.txt"
          $t = 0; while ($t -lt 300) { Start-Sleep 3; $t += 3; if ((Test-Path "$out/gui-result.json") -and (Select-String -Path "$out/gui-result.json" -Pattern '"done": true' -Quiet)) { break }; if ($pr.HasExited) { break } }
          "gui48 exited=$($pr.HasExited) exitcode=$(if ($pr.HasExited) { $pr.ExitCode }) waited=$t" | Tee-Object -Append C:/seed/log.txt
          Start-Sleep 3
          Stop-Process -Id $pr.Id -Force -ErrorAction SilentlyContinue
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/item3-50 | Out-Null
          Copy-Item C:/seed/log.txt,C:/seed/err48.txt,C:/seed/stdout48.txt dist/item3-50/ -ErrorAction SilentlyContinue
          foreach ($f in Get-ChildItem $out -File -ErrorAction SilentlyContinue) {
            if ($f.Extension -in '.png','.pdf') { [IO.File]::WriteAllText("$PWD/dist/item3-50/$($f.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))) } else { Copy-Item $f.FullName dist/item3-50/ }
          }
          git add dist; git commit -m "Add item3 v9 retest evidence (run 50)" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }

      - name: Gate verdict
        if: always()
        shell: pwsh
        run: |
          $f = 'C:/seed/g48/gui-result.json'
          if (-not (Test-Path $f)) { throw 'GATE FAIL: no result file written' }
          $r = Get-Content $f -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $r.done) { throw 'GATE FAIL: macro did not finish' }
          if ($r.error) { throw "GATE FAIL: macro error: $($r.error)" }
          if ($r.default_placement -ne 'search') { throw "GATE FAIL: default placement is $($r.default_placement)" }
          foreach ($k in $r.layouts_default.PSObject.Properties) { if ($k.Value.crossings_path -ne 0) { throw "GATE FAIL: $($k.Name) has $($k.Value.crossings_path) path crossings" }; if ($k.Value.crossings_dim -ne 0) { throw "GATE FAIL: $($k.Name) has $($k.Value.crossings_dim) dim-dim crossings" } }
          foreach ($n in 'Z','L_rot45','L') { if (-not $r.layouts_default.$n.pdf_mm) { throw "GATE FAIL: no pdf for $n" } }
          'GATE PASS: default placement search, zero path and dim-dim crossings on all 7 shapes (strict metric), 3 PDFs exported'

  libs:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download installer, verify SHA256, install, add Mesa (CI only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory C:/out,C:/seed -Force | Out-Null
          foreach ($t in "standalone-v16-r1") { gh release download $t -p "DeltaEngineering-Setup-v16*.exe" -D C:/out; if ($LASTEXITCODE -eq 0) { break } }
          $want = ((Get-Content dist/v16/DeltaEngineering-Setup-v16.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v16*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no downloaded asset matches the dist/v16 SHA256' }
          "SHA256 MATCH $ok" | Tee-Object C:/seed/log.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "setup exit $($p.ExitCode)" | Tee-Object -Append C:/seed/log.txt
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          Get-ChildItem $app -Directory | Select-Object -ExpandProperty Name | Tee-Object -Append C:/seed/log.txt
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
          
      - name: Parts and fittings library retest (console)
        shell: pwsh
        run: |
          $app0 = "$env:LOCALAPPDATA\Programs\DeltaEngineering"
          $df = Get-ChildItem $app0 -Recurse -Filter drafting.py | Select-Object -First 1
          $pkg = $df.Directory.FullName
          "package dir $pkg" | Tee-Object -Append C:/seed/log.txt
          [IO.File]::WriteAllBytes("$pkg\parts_library.py", [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pkg\fittings_library.py", [Convert]::FromBase64String(''))
          [IO.File]::WriteAllText('C:/seed/libs48.py', [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')), (New-Object Text.UTF8Encoding $false))
          $out = "C:/seed/libs"; New-Item -ItemType Directory $out -Force | Out-Null
          $mt = Get-Content 'C:/seed/libs48.py' -Raw -Encoding utf8
          [IO.File]::WriteAllText('C:/seed/libs48.py', $mt.Replace('@@OUT@@', $out), (New-Object Text.UTF8Encoding $false))
          $pr = Start-Process "$env:LOCALAPPDATA\Programs\DeltaEngineering\bin\FreeCADCmd.exe" -ArgumentList "C:\seed\libs48.py" -WorkingDirectory "$env:LOCALAPPDATA\Programs\DeltaEngineering" -PassThru -RedirectStandardError "C:/seed/libs-err.txt" -RedirectStandardOutput "C:/seed/libs-out.txt" -Wait
          "libs exitcode=$($pr.ExitCode)" | Tee-Object -Append C:/seed/log.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/libs-50 | Out-Null
          Copy-Item C:/seed/log.txt,C:/seed/libs-err.txt,C:/seed/libs-out.txt dist/libs-50/ -ErrorAction SilentlyContinue
          Copy-Item "$out/libs-result.json" dist/libs-50/ -ErrorAction SilentlyContinue
          git add dist; git commit -m "Add parts/fittings library retest evidence (run 50)" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }

      - name: Gate verdict
        if: always()
        shell: pwsh
        run: |
          $f = 'C:/seed/libs/libs-result.json'
          if (-not (Test-Path $f)) { throw 'GATE FAIL: no libs result file' }
          $r = Get-Content $f -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $r.done) { throw 'GATE FAIL: macro did not finish' }
          if ($r.error) { throw "GATE FAIL: $($r.error)" }
          foreach ($k in $r.libs.parts.PSObject.Properties) { if ($k.Value.bad.Count -gt 0) { throw "GATE FAIL: $($k.Name) failures: $($k.Value.bad | ConvertTo-Json -Compress)" } }
          if (-not $r.libs.edit_test.nut_edited_valid) { throw 'GATE FAIL: nut edit invalid' }
          if (-not $r.libs.edit_test.gear_teeth_edited_valid) { throw 'GATE FAIL: gear edit invalid' }
          if (-not $r.libs.fittings.status_has_sources) { throw 'GATE FAIL: fittings provenance missing' }
          if (-not $r.libs.fittings.flange_nps2_check) { throw 'GATE FAIL: flange values wrong' }
          $total = 0; foreach ($k in $r.libs.parts.PSObject.Properties) { $total += $k.Value.ok }
          "GATE PASS: $total parametric parts valid + editable; fittings tables verified"

