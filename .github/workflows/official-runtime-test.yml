name: Official runtime plus Delta addon test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download official FreeCAD 1.1.4 Windows portable and verify SHA256
        shell: bash
        run: |
          base=https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4
          curl -fL --retry 3 -o fc.7z "$base/FreeCAD_1.1.4-Windows-x86_64-py311.7z"
          curl -fL --retry 3 -o fc.sha "$base/FreeCAD_1.1.4-Windows-x86_64-py311.7z-SHA256.txt"
          cat fc.sha
          want=$(cut -d' ' -f1 fc.sha)
          got=$(sha256sum fc.7z | cut -d' ' -f1)
          echo "want=$want got=$got"
          [ "$want" = "$got" ]
          mkdir -p /c/fcrt
          7z x fc.7z -o/c/fcrt -y > /dev/null
          rm fc.7z
          find /c/fcrt -maxdepth 3 -iname 'FreeCADCmd.exe' -o -maxdepth 3 -iname 'FreeCAD.exe'
      - name: Unpack Delta source
        shell: bash
        run: |
          mkdir -p /c/delta
          unzip -q src/*DeltaEngineering-development-source-v58-10539385.zip -d /c/delta
          ls /c/delta/DeltaEngineering | head -20
      - name: Make test sources read UTF-8 explicitly (Windows default is cp1252)
        shell: bash
        run: |
          grep -rl 'read_text()' /c/delta/DeltaEngineering/tests | xargs sed -i "s/read_text()/read_text(encoding='utf-8')/g"
          grep -rl '/tmp/cad-development' /c/delta/DeltaEngineering/tests | xargs -r sed -i 's#/tmp/cad-development#C:/delta/DeltaEngineering#g'
          grep -rn "read_text(" /c/delta/DeltaEngineering/tests | head -5
      - name: Run Delta regression suites with official Windows FreeCADCmd
        shell: pwsh
        run: |
          $cmd = (Get-ChildItem C:/fcrt -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1).FullName
          "FreeCADCmd: $cmd"
          & $cmd --version
          $env:PYTHONUTF8 = '1'
          python C:/delta/DeltaEngineering/development/run_regression.py --runtime $cmd --timeout 240
          $r = $LASTEXITCODE
          "Regression exit: $r" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-Content C:/delta/DeltaEngineering/evidence/developer-regression.json | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Print failing suite logs
        shell: pwsh
        run: |
          foreach ($n in 'measurement.py','arabic_presentation.py') {
            "=== $n ===" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            Get-Content "C:/delta/DeltaEngineering/evidence/$n.developer.log" -Tail 40 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
      - name: Show measurement error file
        shell: pwsh
        run: |
          $f = 'C:/delta/DeltaEngineering/evidence/measurement-error.txt'
          if (Test-Path $f) { "=== measurement-error.txt ===" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY; Get-Content $f -Tail 40 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY } else { "no measurement-error.txt" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          exit 0
      - name: Diagnose measurement.py directly
        shell: pwsh
        run: |
          $cmd = (Get-ChildItem C:/fcrt -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1).FullName
          $env:DELTA_DEV_ROOT = 'C:/delta/DeltaEngineering'
          $env:PYTHONPATH = 'C:/delta/DeltaEngineering'
          $out = & $cmd C:/delta/DeltaEngineering/tests/measurement.py 2>&1 | Out-String
          "=== measurement direct, exit $LASTEXITCODE ===" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          ($out -split "`n" | Select-Object -Last 40) -join "`n" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $global:LASTEXITCODE = 0
          exit 0
      - name: Smoke import from official runtime Mod folder and build addon package
        shell: pwsh
        run: |
          $rt = 'C:/fcrt/FreeCAD_1.1.4-Windows-x86_64-py311'
          Get-ChildItem $rt -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem $rt/bin -Filter FreeCAD*.exe | Select-Object -ExpandProperty Name
          New-Item -ItemType Directory -Force "$rt/Mod" | Out-Null
          Copy-Item C:/delta/DeltaEngineering/package/Mod/DeltaEngineering "$rt/Mod/DeltaEngineering" -Recurse -Force
          @('import traceback','try:','    import FreeCAD, DeltaEngineering.core','    print("DELTA_IMPORT_OK")','except Exception:','    traceback.print_exc()') | Set-Content C:/smoke.py
          & "$rt/bin/FreeCADCmd.exe" C:/smoke.py 2>&1 | Out-String | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $global:LASTEXITCODE = 0
          $pk = 'C:/pkg/DeltaEngineering-Windows-addon'
          New-Item -ItemType Directory -Force "$pk/Mod" | Out-Null
          Copy-Item C:/delta/DeltaEngineering/package/Mod/DeltaEngineering "$pk/Mod/DeltaEngineering" -Recurse -Force
          Copy-Item C:/delta/DeltaEngineering/COPYING "$pk/COPYING"
          Copy-Item C:/delta/DeltaEngineering/LaunchDelta.FCMacro "$pk/LaunchDelta.FCMacro"
          @'
          param([string]$Target = "$env:LOCALAPPDATA\Programs\DeltaEngineering", [switch]$NoShortcut)
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4'
          $name = 'FreeCAD_1.1.4-Windows-x86_64-py311-installer.exe'
          $tmp = Join-Path $env:TEMP $name
          Write-Host "Downloading official FreeCAD 1.1.4 (about 520 MB)..."
          Invoke-WebRequest "$base/$name" -OutFile $tmp -UseBasicParsing
          $want = (([string](Invoke-RestMethod "$base/$name-SHA256.txt")) -split '\s+')[0]
          $got = (Get-FileHash $tmp -Algorithm SHA256).Hash
          if ($got -ine $want) { throw "SHA256 mismatch: expected $want got $got" }
          Write-Host "SHA256 verified. Installing to $Target ..."
          $p = Start-Process $tmp -ArgumentList '/S', "/D=$Target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "FreeCAD installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem $Target -Recurse -Filter FreeCAD.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $exe) { throw "FreeCAD.exe not found after install" }
          $Root = $exe.Directory.Parent.FullName
          Write-Host "FreeCAD installed at $Root"
          New-Item -ItemType Directory -Force "$Root\Mod" | Out-Null
          Copy-Item "$PSScriptRoot\Mod\DeltaEngineering" "$Root\Mod\DeltaEngineering" -Recurse -Force
          Copy-Item "$PSScriptRoot\LaunchDelta.FCMacro" "$Root\LaunchDelta.FCMacro" -Force
          if (-not $NoShortcut) {
            $dir = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $dir 'Delta Engineering.lnk'))
            $s.TargetPath = $exe.FullName
            $s.Arguments = "`"$Root\LaunchDelta.FCMacro`""
            $s.WorkingDirectory = $Root
            $s.Save()
          }
          Write-Host "Done. Start 'Delta Engineering' from the Start Menu."
          '@ | Set-Content "$pk/Install-Delta.ps1" -Encoding utf8
          '@echo off' | Set-Content "$pk/Install-Delta.cmd" -Encoding ascii
          'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0Install-Delta.ps1"' | Add-Content "$pk/Install-Delta.cmd" -Encoding ascii
          'pause' | Add-Content "$pk/Install-Delta.cmd" -Encoding ascii
          Compress-Archive -Path $pk -DestinationPath C:/pkg/DeltaEngineering-Windows-addon.zip -Force
          (Get-Item C:/pkg/DeltaEngineering-Windows-addon.zip).Length
          exit 0
      - name: Probe actual measurement values
        shell: pwsh
        run: |
          $cmd = 'C:/fcrt/FreeCAD_1.1.4-Windows-x86_64-py311/bin/FreeCADCmd.exe'
          @('import sys','sys.path.insert(0,"C:/delta/DeltaEngineering")','import FreeCAD as A,Part','from types import SimpleNamespace as E','from DeltaEngineering.measurement import inspect','d=A.newDocument("M");p=d.addObject("App::Part","P");p.Placement=A.Placement(A.Vector(100,200,0),A.Rotation(A.Vector(0,0,1),90));b=d.addObject("Part::Box","B");b.Length=100;b.Width=50;b.Height=30;b.Placement.Base=A.Vector(10,0,0);p.addObject(b);d.recompute()','r=inspect([E(Object=b,SubElementNames=())])','print("MEAS_PROBE",repr(r["items"][0]["volume_mm3"]),repr(r["items"][0]["bounds_mm"]))') | Set-Content C:/probe.py
          $o = & $cmd C:/probe.py 2>&1 | Out-String
          $o | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $global:LASTEXITCODE = 0
          exit 0
      - name: Commit addon zip into repo for retrieval
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p dist && cp /c/pkg/DeltaEngineering-Windows-addon.zip dist/
          base64 -w0 /c/pkg/DeltaEngineering-Windows-addon.zip > dist/DeltaEngineering-Windows-addon.zip.b64
          sha256sum /c/pkg/DeltaEngineering-Windows-addon.zip > dist/DeltaEngineering-Windows-addon.zip.sha256
          git add dist/DeltaEngineering-Windows-addon.zip dist/DeltaEngineering-Windows-addon.zip.b64 dist/DeltaEngineering-Windows-addon.zip.sha256
          git commit -m "Add built addon zip" || true
          git push || true
      - name: End-to-end test of Install-Delta.ps1 plus GUI launch screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Expand-Archive C:/pkg/DeltaEngineering-Windows-addon.zip C:/pkgtest -Force
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:/pkgtest/DeltaEngineering-Windows-addon/Install-Delta.ps1 -Target C:\DeltaTest -NoShortcut 2>&1 | Out-String | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "install exit $LASTEXITCODE" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $exe = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCAD.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          "FreeCAD at: $($exe.FullName)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $root = $exe.Directory.Parent.FullName
          Get-ChildItem "$root/Mod" | Select-Object -ExpandProperty Name | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Start-Process $exe.FullName -ArgumentList "`"$root\LaunchDelta.FCMacro`""
          Start-Sleep -Seconds 75
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object Drawing.Bitmap $b.Width,$b.Height
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size)
          New-Item -ItemType Directory -Force C:/shots | Out-Null
          $bmp.Save('C:/shots/gui.png')
          Get-Process | Where-Object { $_.ProcessName -like 'FreeCAD*' } | Select-Object ProcessName,MainWindowTitle | Out-String | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Commit GUI screenshot for viewing
        shell: bash
        run: |
          git pull --rebase || true
          cp /c/shots/gui.png dist/gui-launch.png || true
          git add dist/gui-launch.png || true
          git commit -m "Add GUI launch screenshot" || true
          git push || true
      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: delta-windows-addon
          path: C:/pkg/DeltaEngineering-Windows-addon.zip
          retention-days: 14
      - name: Upload small test evidence
        uses: actions/upload-artifact@v4
        with:
          name: delta-windows-test-evidence
          path: |
            C:/delta/DeltaEngineering/evidence/developer-regression.json
            C:/delta/DeltaEngineering/evidence/*.developer.log
          retention-days: 7
