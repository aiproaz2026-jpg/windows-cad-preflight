name: v12 electrical GUI launcher test 24 on v15 installed copy - real shortcut command line and baseline vs patched launcher
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gui:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download installer, verify SHA256, install, add Mesa (CI only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory C:/out,C:/seed -Force | Out-Null
          foreach ($t in "standalone-v15-r1") { gh release download $t -p "DeltaEngineering-Setup-v15*.exe" -D C:/out; if ($LASTEXITCODE -eq 0) { break } }
          $want = ((Get-Content dist/v15/DeltaEngineering-Setup-v15.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v15*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no downloaded asset matches the dist/v15 SHA256' }
          "SHA256 MATCH $ok" | Tee-Object C:/seed/log.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "setup exit $($p.ExitCode)" | Tee-Object -Append C:/seed/log.txt
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          Get-ChildItem $app -Directory | Select-Object -ExpandProperty Name | Tee-Object -Append C:/seed/log.txt
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
      - name: Launcher startup sessions through the shortcut command line (baseline vs patched launcher)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          New-Item -ItemType Directory C:/obs -Force | Out-Null
          $obs = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $newl = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $origl = [IO.File]::ReadAllText("$app\LaunchDelta.FCMacro", [Text.Encoding]::UTF8)
          Copy-Item "$app\LaunchDelta.FCMacro" C:/obs/LaunchDelta.installed-original.txt
          $lnkp = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Delta Engineering.lnk"
          "shortcut exists: $(Test-Path $lnkp)" | Tee-Object -Append C:/obs/log.txt
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnkp)
          "shortcut target: $($sc.TargetPath) | args: $($sc.Arguments) | wd: $($sc.WorkingDirectory)" | Tee-Object -Append C:/obs/log.txt
          "installed original launcher has _tidy: $($origl -match '_tidy') ; new launcher has _tidy: $($newl -match '_tidy')" | Tee-Object -Append C:/obs/log.txt
          $cfgdir = "$env:APPDATA\FreeCAD\v1-1"
          "user.cfg exists after install: $(Test-Path $cfgdir\user.cfg)" | Tee-Object -Append C:/obs/log.txt
          Copy-Item "$cfgdir\user.cfg" C:/obs/user.cfg.pristine -Force
          function Restore-Cfg { Copy-Item C:/obs/user.cfg.pristine "$cfgdir\user.cfg" -Force }
          function Run-Session($name, $variant, $kind, $extra) {
            $dir = "C:/obs/$name"; New-Item -ItemType Directory $dir -Force | Out-Null
            $h = @{dir=$dir; kind=$kind; variant=$variant}; foreach ($k in $extra.Keys) { $h[$k] = $extra[$k] }
            [IO.File]::WriteAllText('C:/obs/scenario.json', ($h | ConvertTo-Json), (New-Object Text.UTF8Encoding $false))
            $body = if ($variant -eq 'baseline') { $origl } else { $newl }
            [IO.File]::WriteAllText("$app\LaunchDelta.FCMacro", $body + "`n" + $obs, (New-Object Text.UTF8Encoding $false))
            $env:GALLIUM_DRIVER = 'llvmpipe'; $env:MESA_GL_VERSION_OVERRIDE = '4.5'
            $pr = Start-Process $sc.TargetPath -ArgumentList $sc.Arguments -WorkingDirectory $sc.WorkingDirectory -PassThru -RedirectStandardError "$dir/err.txt" -RedirectStandardOutput "$dir/out.txt"
            $t = 0
            while ($t -lt 110) { Start-Sleep 2; $t += 2; if ($kind -eq 'observe' -and (Test-Path "$dir/done.json")) { break }; if ($kind -eq 'prep' -and $pr.HasExited) { break } }
            "$name kind=$kind exited=$($pr.HasExited) waited=$t done=$(Test-Path $dir/done.json)" | Tee-Object -Append C:/obs/log.txt
            try { $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size); $bmp.Save("$dir/screen.png") } catch {}
            Stop-Process -Id $pr.Id -Force -ErrorAction SilentlyContinue
            Get-Process FreeCAD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
          }
          foreach ($v in 'baseline','patched') {
            Restore-Cfg
            Run-Session "$v-1-fresh" $v observe @{reopen=$false; dialogs=$true}
            Restore-Cfg
            Run-Session "$v-2-prep_visible" $v prep @{show=$true}
            Run-Session "$v-3-saved_visible" $v observe @{reopen=$false; dialogs=$true}
            Restore-Cfg
            Run-Session "$v-4-prep_hidden" $v prep @{show=$false}
            Run-Session "$v-5-saved_hidden_untouched" $v observe @{reopen=$false; dialogs=$false}
            Run-Session "$v-6-saved_hidden_reopen3s" $v observe @{reopen=$true; dialogs=$true}
          }
          Copy-Item C:/obs/user.cfg.pristine C:/obs/user.cfg.pristine.txt
          
      - name: Commit evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/launch24 | Out-Null
          Copy-Item C:/obs/log.txt,C:/seed/log.txt,C:/obs/LaunchDelta.installed-original.txt dist/launch24/ -ErrorAction SilentlyContinue
          foreach ($d in Get-ChildItem C:/obs -Directory -ErrorAction SilentlyContinue) {
            $n = $d.Name
            foreach ($f in Get-ChildItem $d.FullName -File) {
              if ($f.Extension -in '.json','.txt') { Copy-Item $f.FullName "dist/launch24/$n-$($f.Name)" }
              elseif ($f.Extension -eq '.jpg') { [IO.File]::WriteAllText("$PWD/dist/launch24/$n-$($f.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))) }
            }
          }
          git add dist; git commit -m "Add launcher test evidence" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
