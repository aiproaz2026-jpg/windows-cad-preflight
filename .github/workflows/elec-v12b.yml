name: v12 electrical edit/move/export test on the published installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  elec:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download installer, verify SHA256, install to C:/DeltaTest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory C:/out,C:/seed/elec2,C:/seed/elec2o -Force | Out-Null
          foreach ($t in "standalone-v12-r1","standalone-v12-r2","standalone-v12-r3") { gh release download $t -p "DeltaEngineering-Setup-v12*.exe" -D C:/out; if ($LASTEXITCODE -eq 0) { break } }
          $want = ((Get-Content dist/v12/DeltaEngineering-Setup-v12.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v12*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no downloaded asset matches the dist/v12 SHA256' }
          "SHA256 MATCH $ok" | Tee-Object C:/seed/elec2/sha.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\DeltaTest' -Wait -PassThru
          "setup exit $($p.ExitCode)"
      - name: Run edit/move/save-reopen/label/export test, original export module
        continue-on-error: true
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('C:/elec_test2.py', [Convert]::FromBase64String(''))
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'; $env:ELEC_OUT = 'C:/seed/elec2o'
          $o = & $cmd.FullName -c "exec(open('C:/elec_test2.py',encoding='utf-8').read())" 2>&1 | Out-String
          $o | Set-Content C:/seed/elec2o/out.txt -Encoding utf8; $o
      - name: Patch installed export.py (per-terminal label side) and rerun
        continue-on-error: true
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('C:/patch_export.py', [Convert]::FromBase64String(''))
          $cmd = Get-ChildItem C:/DeltaTest -Recurse -Filter FreeCADCmd.exe | Select-Object -First 1
          $env:PYTHONUTF8 = '1'; $env:ELEC_OUT = 'C:/seed/elec2'
          $o = & $cmd.FullName -c "exec(open('C:/patch_export.py',encoding='utf-8').read())" 2>&1 | Out-String; $o
          $o = & $cmd.FullName -c "exec(open('C:/elec_test2.py',encoding='utf-8').read())" 2>&1 | Out-String
          $o | Set-Content C:/seed/elec2/out.txt -Encoding utf8; $o
      - name: Commit evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/elec-v12b/orig,dist/elec-v12b/patched | Out-Null
          Copy-Item C:/seed/elec2o/*.json,C:/seed/elec2o/*.txt dist/elec-v12b/orig/ -ErrorAction SilentlyContinue
          Copy-Item C:/seed/elec2/*.json,C:/seed/elec2/*.txt dist/elec-v12b/patched/ -ErrorAction SilentlyContinue
          foreach ($f in @()) { $d = if ($f.DirectoryName -like '*elec2o') { 'orig' } else { 'patched' }; [IO.File]::WriteAllText("$PWD/dist/elec-v12b/$d/$($f.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))) }
          git add dist; git commit -m "Add elec-v12b evidence" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
