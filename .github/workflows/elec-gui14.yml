name: v12 electrical GUI run 14 on v13 installer plus toggle module symbols mouse - layout, labels + contactor symbol + on-screen ids (installed-copy test)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gui:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download installer, verify SHA256, install, add Mesa (CI only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory C:/out,C:/seed -Force | Out-Null
          foreach ($t in "standalone-v13-r1") { gh release download $t -p "DeltaEngineering-Setup-v13*.exe" -D C:/out; if ($LASTEXITCODE -eq 0) { break } }
          $want = ((Get-Content dist/v13/DeltaEngineering-Setup-v13.exe.sha256 -Raw) -split '\s+')[0].ToLower()
          $ok = $null
          foreach ($f in Get-ChildItem C:/out -Filter "DeltaEngineering-Setup-v13*.exe") { if ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() -eq $want) { $ok = $f.FullName } }
          if (-not $ok) { throw 'no downloaded asset matches the dist/v13 SHA256' }
          "SHA256 MATCH $ok" | Tee-Object C:/seed/log.txt
          $p = Start-Process $ok -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          "setup exit $($p.ExitCode)" | Tee-Object -Append C:/seed/log.txt
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          Get-ChildItem $app -Directory | Select-Object -ExpandProperty Name | Tee-Object -Append C:/seed/log.txt
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $a.browser_download_url -OutFile C:/mesa.7z
          7z x C:/mesa.7z -oC:/mesa -y | Out-Null
          Copy-Item C:/mesa/x64/opengl32.dll $bin -Force
          foreach ($n in 'libgallium_wgl.dll','libglapi.dll') { if (Test-Path "C:/mesa/x64/$n") { Copy-Item "C:/mesa/x64/$n" $bin -Force } }
      - name: GUI export, original export module then patched module
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $app = "$env:LOCALAPPDATA\Programs\DeltaEngineering"; $bin = "$app\bin"
          $mt = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $modroot = (Get-ChildItem $app -Recurse -Filter export.py | Select-Object -First 1)
          "export.py at $($modroot.FullName)" | Tee-Object -Append C:/seed/log.txt
          Copy-Item $modroot.FullName C:/seed/installed-export.py.txt
          $appmod = $modroot.Directory.Parent.Parent.FullName -replace '\\','/'
          "appmod root $appmod" | Tee-Object -Append C:/seed/log.txt
          foreach ($mode in @('layout14')) {
            if ($mode -eq 'layout14') {
              $idp = Get-ChildItem $app -Recurse -Filter identifiers.py | Select-Object -First 1
              "identifiers.py at $($idp.FullName)" | Tee-Object -Append C:/seed/log.txt
              [IO.File]::WriteAllBytes($idp.FullName, [Convert]::FromBase64String(''))
              [IO.File]::WriteAllBytes('C:/seed/patch_export4.py', [Convert]::FromBase64String(''))
              [IO.File]::WriteAllBytes('C:/seed/patch_export5.py', [Convert]::FromBase64String(''))
              $sy = Join-Path $idp.DirectoryName 'symbols.py'; $co = Join-Path $idp.DirectoryName 'core.py'
              python C:/seed/patch_export4.py $sy 2>&1 | Tee-Object -Append C:/seed/log.txt
              if ($LASTEXITCODE -ne 0) { throw 'patch4 failed' }
              python C:/seed/patch_export5.py $co $sy 2>&1 | Tee-Object -Append C:/seed/log.txt
              if ($LASTEXITCODE -ne 0) { throw 'patch5 failed' }
            }
            $out = "C:/seed/g-$mode"; New-Item -ItemType Directory $out -Force | Out-Null
            $mm = $mt.Replace('@@OUT@@', $out).Replace('@@APP@@', $appmod)
            [IO.File]::WriteAllText("C:/seed/gui-$mode.FCMacro", $mm, (New-Object Text.UTF8Encoding $false))
            $env:GALLIUM_DRIVER = 'llvmpipe'; $env:MESA_GL_VERSION_OVERRIDE = '4.5'
            $pr = Start-Process "$bin\FreeCAD.exe" -ArgumentList "C:\seed\gui-$mode.FCMacro" -WorkingDirectory $app -PassThru -RedirectStandardError "C:/seed/err-$mode.txt" -RedirectStandardOutput "C:/seed/stdout-$mode.txt"
            $t = 0; while ($t -lt 150) { Start-Sleep 3; $t += 3; if ((Test-Path "$out/gui-result.json") -and (Select-String -Path "$out/gui-result.json" -Pattern '"done": true' -Quiet)) { break }; if ($pr.HasExited) { break } }
            "mode $mode exited=$($pr.HasExited) exitcode=$(if ($pr.HasExited) { $pr.ExitCode }) waited=$t" | Tee-Object -Append C:/seed/log.txt
            Start-Sleep 3
            $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size); $bmp.Save("C:/seed/g-$mode.png")
            Stop-Process -Id $pr.Id -Force -ErrorAction SilentlyContinue
            Get-Process FreeCAD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
          }
      - name: Commit evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          New-Item -ItemType Directory -Force dist/elec-gui14 | Out-Null
          Copy-Item C:/seed/log.txt,C:/seed/err-*.txt,C:/seed/stdout-*.txt,C:/seed/installed-export.py.txt dist/elec-gui14/ -ErrorAction SilentlyContinue
          foreach ($m in 'layout14') {
            if (Test-Path C:/seed/g-$m/gui-result.json) { Copy-Item C:/seed/g-$m/workbench.png C:/seed/null.png -ErrorAction SilentlyContinue; if (Test-Path C:/seed/g-$m/workbench.png) { [IO.File]::WriteAllText("$PWD/dist/elec-gui14/$m-workbench.png.b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:/seed/g-$m/workbench.png"))) }; Copy-Item C:/seed/g-$m/gui-result.json dist/elec-gui14/gui-result-$m.json }
            foreach ($pn in Get-ChildItem C:/seed/g-$m -Filter *.png -ErrorAction SilentlyContinue) { [IO.File]::WriteAllText("$PWD/dist/elec-gui14/$m-$($pn.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($pn.FullName))) }
            if (Test-Path C:/seed/g-$m/view.png) { [IO.File]::WriteAllText("$PWD/dist/elec-gui14/$m-view.png.b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:/seed/g-$m/view.png"))) }
            foreach ($f in Get-ChildItem C:/seed/g-$m -Filter *.pdf -ErrorAction SilentlyContinue) { [IO.File]::WriteAllText("$PWD/dist/elec-gui14/$m-$($f.Name).b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))) }
            if (Test-Path C:/seed/g-$m.png) { [IO.File]::WriteAllText("$PWD/dist/elec-gui14/g-$m.png.b64", [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:/seed/g-$m.png"))) }
          }
          git add dist; git commit -m "Add elec-gui evidence" 2>&1 | Out-Null
          foreach ($i in 1..4) { git pull --rebase 2>&1 | Out-Null; git push 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
